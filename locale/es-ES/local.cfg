[achievement-description]
rookie-archaeologist=Incluso los arqueólogos más famosos comenzaron desde abajo. Investiga [technology=ufo-resonance-raw-shard-tech].
senior-archaeologist=La práctica hace al maestro y domina la exploración de [technology=ufo-tech].
experienced-archaeologist=Excava como un arqueólogo famoso, no temas a los peligros e investiga [technology=ufo-fulgoran-know-how-tech].

