[mod-name]
ufo=Usa objetos fulgorianos (U.F.O.)

[mod-description]
ufo=¿Alguna vez te has preguntado qué les ocurrió a los fulgorianos o cómo podría aprovecharse su tecnología?\nPues bien, entonces deberías iniciar investigaciones arqueológicas y excavar más profundamente; obtendrás las respuestas.\n\nPero cuidado: podrías toparte con algo que habría sido mejor dejar en paz.

[mod-setting-name]
ufo-logLevel=elegir nivel de registro
ufo-mined-ruin-vaults-needed=número de __ENTITY__fulgoran-ruin-vault__
ufo-frd-vaults-color=color para __ENTITY__fulgoran-ruin-vault__
ufo-frd-shard-color=color para __ENTITY__fe_resonance_shard__
