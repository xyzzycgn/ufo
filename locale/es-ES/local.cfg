[entity-description]
ufo-adapter=Permite el uso directo de objetos fulgorianos o el uso del conocimiento fulgoriano en la construcción de instalaciones mejoradas.
ufo-adaptees=__1__ con __ENTITY__ufo-adapter__ puede conectarse a un __ENTITY__fulgoran-ruin-attractor__.
ufo-adapted-attractor=__ENTITY__fulgoran-ruin-attractor__ conectado a un poste eléctrico con un __ENTITY__ufo-adapter__.
ufo-electromagnetic-plant=La __ENTITY__electromagnetic-plant__ mejorada con conocimiento fulgoriano es más compacta y eficiente.
ufo-recycler=El reciclador mejorado es más compacto.
ufo-beacon=El __ENTITY__beacon__ mejorado es más pequeño y potente.
ufo-crusher=El __ENTITY__ufo-crusher__ solo puede construirse en planetas.
ufo-inhibitor=__ENTITY__ufo-inhibitor__ proporciona protección durante la extracción manual de un __ENTITY__fulgoran-ruin-vault__

[factoriopedia-description]
ufo-adapted-attractor=Según la leyenda, el __ENTITY__fulgoran-ruin-attractor__ tiene una eficiencia superior. Esto puede aprovecharse con el __ENTITY__ufo-adapter__.
ufo-electromagnetic-plant=Al utilizar conocimiento fulgoriano, la __ENTITY__electromagnetic-plant__ mejorada requiere menos espacio y es más eficiente.
ufo-detector-equipment=El detector de reliquias fulgorianas (F.R.D.) puede instalarse en varios vehículos y ayuda en la búsqueda de reliquias fulgorianas específicas.
ufo-recycler=Al utilizar conocimiento fulgoriano, el __ENTITY__recycler__ mejorado puede construirse de forma más compacta y consume menos energía.
ufo-beacon=Al utilizar conocimiento fulgoriano, el __ENTITY__beacon__ mejorado requiere menos espacio, tiene mayor alcance y más ranuras para módulos.
ufo-pimp-my-car=__ENTITY__car__ mejorado con una pequeña rejilla de equipo en la que se pueden montar [item=ufo-detector-equipment] y una pequeña fuente de energía
ufo-tech=Clave para acceder a la tecnología fulgoriana
ufo-adapter=Puente central entre la tecnología fulgoriana y las tecnologías propias
ufo-crusher=El __ENTITY__ufo-crusher__ solo puede construirse en planetas y es ligeramente más grande
ufo-resonance-raw-shard=__ITEM__ufo-resonance-raw-shard__
ufo-resonance-shard=__ITEM__ufo-resonance-shard__
ufo-inhibitor=__ENTITY__ufo-inhibitor__ proporciona protección contra el Guardián al desmontar manualmente un __ENTITY__fulgoran-ruin-vault__ interfiriendo sus sensores

