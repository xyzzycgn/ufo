[technology-description]
ufo-archeological-tech=Las investigaciones arqueológicas permiten obtener información sobre la tecnología fulgoriana durante la extracción [font=default-semibold][color=green]manual[/color][/font] de un __ENTITY__fulgoran-ruin-vault__, que luego puede usarse para seguir desarrollando las propias tecnologías.
ufo-tech=La eficiencia de un __ENTITY__fulgoran-ruin-attractor__ es legendaria. Los postes eléctricos equipados con un __ENTITY__ufo-adapter__ pueden conectarse a ellos.
ufo-fulgoran-know-how-tech=Permite el uso del conocimiento fulgoriano para mejorar las propias tecnologías
ufo-emp-tech=Permite la construcción de la __ENTITY__electromagnetic-plant__ mejorada
ufo-recycling-tech=Permite la construcción de __ENTITY__ufo-recycler__
ufo-effect-transmission-tech=Permite la construcción de __ENTITY__ufo-beacon__
ufo-detector-equipment-tech=El detector de reliquias fulgorianas (F.R.D.) ayuda en la búsqueda de ciertas reliquias fulgorianas
ufo-pimp-my-car-tech=Amplía el __ENTITY__car__ con una pequeña rejilla de equipo en la que se pueden montar un [item=ufo-detector-equipment] y una pequeña fuente de energía
ufo-resonance-raw-shard-tech=__ITEM__ufo-resonance-raw-shard__ es la base de tecnologías más avanzadas que utilizan conocimiento fulgoriano
ufo-resonance-shard-tech=parte más importante del __ENTITY__ufo-inhibitor__
ufo-inhibitor-tech=protege una pequeña zona
ufo-electric-furnace-tech=Permite la construcción de un __ENTITY__ufo-electric-furnace__
ufo-electrodynamic-fragmentation-tech=La fragmentación electrodinámica (EDF) es un método avanzado para la separación selectiva de materiales compuestos mediante la aplicación de descargas subacuáticas de muy corta duración y alto voltaje. Por lo tanto, se requieren cantidades relativamente grandes de agua para el proceso, pero la mayor parte se puede reutilizar en un circuito cerrado, lo que lo convierte en una operación muy eficiente en el uso de recursos.

