[mod-setting-description]
ufo-logLevel=se registrarán todas las llamadas con este nivel de registro o superior (FATAL es el más alto, FINEST el más bajo)
ufo-mined-ruin-vaults-needed=Número de __ENTITY__fulgoran-ruin-vault__ que deben extraerse para investigar la tecnología __ENTITY__ufo-adapter__.
ufo-frd-vaults-color=color con el que se muestra un __ENTITY__fulgoran-ruin-vault__ en el __ITEM__ufo-detector-equipment__
ufo-frd-shard-color=color con el que se muestra un __ENTITY__fe_resonance_shard__ en el __ITEM__ufo-detector-equipment__
ufo-frd-scan-radius=Radio dentro del cual el __ITEM__ufo-detector-equipment__ puede detectar reliquias
ufo-frd-bg-color=elegir color de fondo del F.R.D.
ufo-frd-free-bg-color=[font=default-semibold][color=red]solo tiene efecto si el color de fondo seleccionado es "personalizado"[/color][/font]

[string-mod-setting]
ufo-frd-bg-color-GREEN=verde
ufo-frd-bg-color-AMBER=ámbar
ufo-frd-bg-color-FREE=personalizado

[string-mod-setting-description]
ufo-frd-bg-color-FREE=permitir elegir un color de fondo arbitrario para el F.R.D.

