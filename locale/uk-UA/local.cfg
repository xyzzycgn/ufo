[achievement-description]
ufo-rookie-archaeologist=Навіть найвідоміші археологи починали з малого. Дослідження [technology=ufo-resonance-raw-shard-tech]
ufo-senior-archaeologist=Практика веде до досконалості та опануйте дослідження [technology=ufo-tech]
ufo-experienced-archaeologist=Копайте, як відомий археолог, не бійтеся небезпек та досліджуйте [technology=ufo-fulgoran-know-how-tech]

