ufo-beacon=покращений __ENTITY__beacon__
ufo-pimp-my-car=__ENTITY__car__ з малою сіткою обладнання
ufo-crusher=планетарний __ENTITY__crusher__
ufo-inhibitor=інгібітор
ufo-fulgoran-ruin-vault=__ENTITY__fulgoran-ruin-vault__

[entity-description]
ufo-adapter=Дозволяє безпосередньо використовувати фулгоріанські об'єкти або застосовувати фулгоріанські знання під час будівництва покращених споруд.
ufo-adaptees=__1__ з __ENTITY__ufo-adapter__ може підключатися до __ENTITY__fulgoran-ruin-attractor__.
ufo-adapted-attractor=__ENTITY__fulgoran-ruin-attractor__, підключений до електричного стовпа з __ENTITY__ufo-adapter__.
ufo-electromagnetic-plant=__ENTITY__electromagnetic-plant__, покращена завдяки фулгоріанським знанням, є компактнішою та ефективнішою.
ufo-recycler=Покращений переробник компактніший.
ufo-beacon=Покращений __ENTITY__beacon__ менший і потужніший.
ufo-crusher=__ENTITY__ufo-crusher__ можна будувати лише на планетах.
ufo-inhibitor=__ENTITY__ufo-inhibitor__ забезпечує захист під час ручного видобутку __ENTITY__fulgoran-ruin-vault__

[factoriopedia-description]
ufo-adapted-attractor=За легендою, __ENTITY__fulgoran-ruin-attractor__ має вищу ефективність. Це можна використати за допомогою __ENTITY__ufo-adapter__.
ufo-electromagnetic-plant=Використання фулгоріанських знань робить покращену __ENTITY__electromagnetic-plant__ компактнішою та ефективнішою.
ufo-detector-equipment=Детектор фулгоріанських реліквій (F.R.D.) можна встановлювати на різні транспортні засоби, і він допомагає у пошуку певних фулгоріанських реліквій.
ufo-recycler=Використовуючи фулгоріанські знання, покращений __ENTITY__recycler__ можна побудувати компактніше, і він споживає менше енергії.
ufo-beacon=Використовуючи фулгоріанські знання, покращений __ENTITY__beacon__ потребує менше місця, має більший радіус дії та більше слотів для модулів.
ufo-pimp-my-car=Покращений __ENTITY__car__ з малою сіткою обладнання, у яку можна встановити [item=ufo-detector-equipment] і невелике джерело живлення
ufo-tech=Ключ до доступу до фулгоріанських технологій
ufo-adapter=Центральний міст між фулгоріанськими та власними технологіями
ufo-crusher=__ENTITY__ufo-crusher__ можна будувати лише на планетах, і він трохи більший
ufo-resonance-raw-shard=__ITEM__ufo-resonance-raw-shard__
ufo-resonance-shard=__ITEM__ufo-resonance-shard__
ufo-inhibitor=__ENTITY__ufo-inhibitor__ захищає від Вартового під час ручного демонтажу __ENTITY__fulgoran-ruin-vault__, глушачи його сенсори

