[mod-name]
ufo=Використовуйте фулгоріанські об'єкти (U.F.O.)

[mod-description]
ufo=Ви коли-небудь замислювалися, що сталося з фулгоріанцями або як їхню технологію можна було б використати з користю?\nЩо ж, тоді вам варто розпочати археологічні дослідження й копати глибше; ви отримаєте відповіді.\n\nАле будьте обережні — ви можете натрапити на щось, що краще було б не чіпати.

[mod-setting-name]
ufo-logLevel=вибрати рівень журналювання
ufo-mined-ruin-vaults-needed=кількість __ENTITY__fulgoran-ruin-vault__
ufo-frd-vaults-color=колір для __ENTITY__fulgoran-ruin-vault__
ufo-frd-shard-color=колір для __ENTITY__fe_resonance_shard__
ufo-frd-scan-radius=радіус сканування F.R.D.
ufo-frd-bg-color=колір фону для F.R.D.
ufo-frd-free-bg-color=встановити власний колір фону для F.R.D.

[mod-setting-description]
ufo-logLevel=усі виклики з цим рівнем журналювання або вищим буде записано до журналу (FATAL — найвищий, FINEST — найнижчий рівень)
ufo-mined-ruin-vaults-needed=Кількість __ENTITY__fulgoran-ruin-vault__, які потрібно видобути, щоб дослідити технологію __ENTITY__ufo-adapter__.
ufo-frd-vaults-color=колір, яким __ENTITY__fulgoran-ruin-vault__ відображається в __ITEM__ufo-detector-equipment__
ufo-frd-shard-color=колір, яким __ENTITY__fe_resonance_shard__ відображається в __ITEM__ufo-detector-equipment__
ufo-frd-scan-radius=Радіус, у межах якого __ITEM__ufo-detector-equipment__ може виявляти реліквії
ufo-frd-bg-color=вибрати колір тла F.R.D.
ufo-frd-free-bg-color=[font=default-semibold][color=red]діє лише якщо вибрано колір фону "власний"[/color][/font]

[string-mod-setting]
ufo-frd-bg-color-GREEN=зелений
ufo-frd-bg-color-AMBER=бурштиновий
ufo-frd-bg-color-FREE=власний

[string-mod-setting-description]
ufo-frd-bg-color-FREE=дозволити вибір довільного кольору тла для F.R.D.

