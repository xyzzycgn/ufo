[technology-description]
ufo-archeological-tech=Археологічні дослідження дають змогу отримувати інформацію про фулгоріанські технології під час [font=default-semibold][color=green]ручного[/color][/font] видобутку __ENTITY__fulgoran-ruin-vault__, яку потім можна використати для подальшого розвитку власних технологій.
ufo-tech=Ефективність __ENTITY__fulgoran-ruin-attractor__ є легендарною. Електричні стовпи, обладнані __ENTITY__ufo-adapter__, можуть підключатися до них.
ufo-fulgoran-know-how-tech=Дозволяє використовувати фулгоріанські знання для покращення власних технологій
ufo-emp-tech=Дозволяє будувати покращену __ENTITY__electromagnetic-plant__
ufo-recycling-tech=Дозволяє будувати __ENTITY__ufo-recycler__
ufo-effect-transmission-tech=Дозволяє будувати __ENTITY__ufo-beacon__
ufo-detector-equipment-tech=Детектор фулгоріанських реліквій (F.R.D.) допомагає у пошуку певних фулгоріанських реліквій
ufo-pimp-my-car-tech=Розширює __ENTITY__car__, додаючи малу сітку обладнання, у яку можна встановити [item=ufo-detector-equipment] і невелике джерело живлення
ufo-resonance-raw-shard-tech=__ITEM__ufo-resonance-raw-shard__ є основою для більш просунутих технологій, що використовують фулгоріанські знання
ufo-resonance-shard-tech=найважливіша частина __ENTITY__ufo-inhibitor__
ufo-inhibitor-tech=захищає невелику ділянку

