[mod-name]
ufo=使用富爾戈蘭物品（U.F.O.）

[mod-description]
ufo=你是否曾經想過富爾戈蘭人發生了什麼事，或是他們的技術要如何才能被善加利用？\n那麼，你應該開始進行考古調查並挖得更深；你會得到答案。\n\n但請小心——你可能會碰上某些本來最好別去碰的東西。

[mod-setting-name]
ufo-logLevel=選擇日誌等級
ufo-mined-ruin-vaults-needed=__ENTITY__fulgoran-ruin-vault__ 數量
ufo-frd-vaults-color=__ENTITY__fulgoran-ruin-vault__ 的顏色
ufo-frd-shard-color=__ENTITY__fe_resonance_shard__ 的顏色
ufo-frd-scan-radius=F.R.D. 掃描半徑
ufo-frd-bg-color=F.R.D. 背景顏色
ufo-frd-free-bg-color=F.R.D. 任意背景顏色

[mod-setting-description]
ufo-logLevel=所有具有此日誌等級或更高等級的呼叫都會被記錄（FATAL 為最高，FINEST 為最低）
ufo-mined-ruin-vaults-needed=研究 __ENTITY__ufo-adapter__ 技術所需開採的 __ENTITY__fulgoran-ruin-vault__ 數量。
ufo-frd-vaults-color=__ENTITY__fulgoran-ruin-vault__ 在 __ITEM__ufo-detector-equipment__ 中顯示時所使用的顏色
ufo-frd-shard-color=__ENTITY__fe_resonance_shard__ 在 __ITEM__ufo-detector-equipment__ 中顯示時所使用的顏色
ufo-frd-scan-radius=__ITEM__ufo-detector-equipment__ 可偵測遺物的半徑範圍
ufo-frd-bg-color=選擇 F.R.D. 背景顏色。
ufo-frd-free-bg-color=F.R.D. 任意背景顏色。選擇 [font=default-semibold][color=red]（僅在所選背景顏色為「任意」時生效）[/color][/font]

[string-mod-setting]
ufo-frd-bg-color-GREEN=綠色
ufo-frd-bg-color-AMBER=琥珀色
ufo-frd-bg-color-FREE=任意

[string-mod-setting-description]
ufo-frd-bg-color-FREE=允許為 F.R.D. 選擇任意背景顏色。

