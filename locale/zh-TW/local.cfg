[technology-description]
ufo-archeological-tech=考古調查讓你能夠在[font=default-semibold][color=green]手動[/color][/font]開採 __ENTITY__fulgoran-ruin-vault__ 時獲得有關富爾戈蘭技術的資訊，之後可用來進一步發展自身技術。
ufo-tech=__ENTITY__fulgoran-ruin-attractor__ 的效率堪稱傳奇。裝備 __ENTITY__ufo-adapter__ 的電線桿可以與其連接。
ufo-fulgoran-know-how-tech=允許使用富爾戈蘭技術知識來改良自身技術
ufo-emp-tech=允許建造改良型 __ENTITY__electromagnetic-plant__
ufo-recycling-tech=允許建造 __ENTITY__ufo-recycler__
ufo-effect-transmission-tech=允許建造 __ENTITY__ufo-beacon__
ufo-detector-equipment-tech=富爾戈蘭遺物探測器（F.R.D.）可協助尋找某些富爾戈蘭遺物
ufo-pimp-my-car-tech=為 __ENTITY__car__ 擴充一個小型裝備網格，可在其中安裝 [item=ufo-detector-equipment] 和一個小型電源
ufo-resonance-raw-shard-tech=__ITEM__ufo-resonance-raw-shard__ 是利用富爾戈蘭技術知識之更進階技術的基礎
ufo-resonance-shard-tech=__ENTITY__ufo-inhibitor__ 最重要的部件
ufo-inhibitor-tech=保護一小片區域

