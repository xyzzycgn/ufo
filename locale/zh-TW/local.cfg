[entity-description]
ufo-adapter=允許直接使用富爾戈蘭物品，或在建造改良設施時運用富爾戈蘭技術知識。
ufo-adaptees=裝有 __ENTITY__ufo-adapter__ 的 __1__ 能夠連接到 __ENTITY__fulgoran-ruin-attractor__。
ufo-adapted-attractor=連接到裝有 __ENTITY__ufo-adapter__ 電線桿上的 __ENTITY__fulgoran-ruin-attractor__。
ufo-electromagnetic-plant=透過富爾戈蘭技術知識改良後的 __ENTITY__electromagnetic-plant__ 更加緊湊且更有效率。
ufo-recycler=改良型回收機更加緊湊。
ufo-beacon=改良後的 __ENTITY__beacon__ 更小且更強大。
ufo-crusher=__ENTITY__ufo-crusher__ 只能建造在行星上。
ufo-inhibitor=__ENTITY__ufo-inhibitor__ 在手動開採 __ENTITY__fulgoran-ruin-vault__ 時提供保護

[factoriopedia-description]
ufo-adapted-attractor=根據傳說，__ENTITY__fulgoran-ruin-attractor__ 擁有卓越的效率。可透過 __ENTITY__ufo-adapter__ 加以利用。
ufo-electromagnetic-plant=藉由運用富爾戈蘭技術知識，改良後的 __ENTITY__electromagnetic-plant__ 佔用更少空間且效率更高。
ufo-detector-equipment=富爾戈蘭遺物探測器（F.R.D.）可安裝於各種載具上，並協助搜尋特定的富爾戈蘭遺物。
ufo-recycler=藉由運用富爾戈蘭技術知識，改良後的 __ENTITY__recycler__ 可建造得更加緊湊，並消耗更少能量。
ufo-beacon=藉由運用富爾戈蘭技術知識，改良後的 __ENTITY__beacon__ 佔用更少空間、範圍更大，且擁有更多模組插槽。
ufo-pimp-my-car=升級後的 __ENTITY__car__ 帶有一個小型裝備網格，可安裝 [item=ufo-detector-equipment] 和一個小型電源
ufo-tech=取得富爾戈蘭技術的鑰匙
ufo-adapter=連接富爾戈蘭技術與自身技術的核心橋樑
ufo-crusher=__ENTITY__ufo-crusher__ 只能建造在行星上，而且體積稍大
ufo-resonance-raw-shard=__ITEM__ufo-resonance-raw-shard__
ufo-resonance-shard=__ITEM__ufo-resonance-shard__
ufo-inhibitor=__ENTITY__ufo-inhibitor__ 會透過干擾守衛者的感測器，在手動拆解 __ENTITY__fulgoran-ruin-vault__ 時提供保護

