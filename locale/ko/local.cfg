[technology-description]
ufo-archeological-tech=고고학 조사를 통해 __ENTITY__fulgoran-ruin-vault__를 [font=default-semibold][color=green]수동으로[/color][/font] 채굴하는 동안 풀고란 기술에 대한 정보를 얻을 수 있으며, 이를 통해 자신의 기술을 더욱 발전시킬 수 있습니다.
ufo-tech=__ENTITY__fulgoran-ruin-attractor__의 효율은 전설적입니다. __ENTITY__ufo-adapter__가 장착된 전신주는 그것들과 연결될 수 있습니다.
ufo-fulgoran-know-how-tech=자체 기술을 개선하기 위해 풀고란 노하우를 사용할 수 있게 합니다
ufo-emp-tech=개선된 __ENTITY__electromagnetic-plant__의 건설을 가능하게 합니다
ufo-recycling-tech=__ENTITY__ufo-recycler__의 건설을 가능하게 합니다
ufo-effect-transmission-tech=__ENTITY__ufo-beacon__의 건설을 가능하게 합니다
ufo-detector-equipment-tech=풀고란 유물 탐지기(F.R.D.)는 특정 풀고란 유물을 찾는 데 도움을 줍니다
ufo-pimp-my-car-tech=__ENTITY__car__에 [item=ufo-detector-equipment]와 소형 전원 장치를 장착할 수 있는 소형 장비 격자를 추가합니다
ufo-resonance-raw-shard-tech=__ITEM__ufo-resonance-raw-shard__는 풀고란 노하우를 활용하는 더 발전된 기술의 기초입니다
ufo-resonance-shard-tech=__ENTITY__ufo-inhibitor__의 가장 중요한 부품
