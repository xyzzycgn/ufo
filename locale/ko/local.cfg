[entity-description]
ufo-adapter=풀고란 물체를 직접 사용하거나 개선된 시설을 건설할 때 풀고란의 노하우를 활용할 수 있게 합니다.
ufo-adaptees=__ENTITY__ufo-adapter__가 장착된 __1__은 __ENTITY__fulgoran-ruin-attractor__에 연결할 수 있습니다.
ufo-adapted-attractor=__ENTITY__ufo-adapter__가 장착된 전신주에 연결된 __ENTITY__fulgoran-ruin-attractor__.
ufo-electromagnetic-plant=풀고란 노하우로 개선된 __ENTITY__electromagnetic-plant__는 더 작고 효율적입니다.
ufo-recycler=개선된 재활용기는 더 컴팩트합니다.
ufo-beacon=개선된 __ENTITY__beacon__은 더 작고 더 강력합니다.
ufo-crusher=__ENTITY__ufo-crusher__는 행성에서만 건설할 수 있습니다.
ufo-inhibitor=__ENTITY__ufo-inhibitor__는 __ENTITY__fulgoran-ruin-vault__를 수동으로 채굴하는 동안 보호를 제공합니다

[factoriopedia-description]
ufo-adapted-attractor=전설에 따르면 __ENTITY__fulgoran-ruin-attractor__는 뛰어난 효율을 지니고 있습니다. 이는 __ENTITY__ufo-adapter__를 통해 활용할 수 있습니다.
ufo-electromagnetic-plant=풀고란 노하우를 활용하면 개선된 __ENTITY__electromagnetic-plant__는 더 적은 공간을 차지하며 더 효율적입니다.
ufo-detector-equipment=풀고란 유물 탐지기(F.R.D.)는 다양한 차량에 장착할 수 있으며, 특정 풀고란 유물을 찾는 데 도움을 줍니다.
ufo-recycler=풀고란 노하우를 활용하면 개선된 __ENTITY__recycler__를 더 컴팩트하게 건설할 수 있고 에너지 소비도 줄어듭니다.
ufo-beacon=풀고란 노하우를 활용하면 개선된 __ENTITY__beacon__은 더 적은 공간을 차지하고, 범위가 늘어나며, 모듈 슬롯도 더 많아집니다.
ufo-pimp-my-car=[item=ufo-detector-equipment]와 소형 전원 장치를 장착할 수 있는 소형 장비 격자가 있는 업그레이드된 __ENTITY__car__
ufo-tech=풀고란 기술에 접근하기 위한 열쇠
ufo-adapter=풀고란 기술과 자체 기술을 잇는 핵심 가교
ufo-crusher=__ENTITY__ufo-crusher__는 행성에서만 건설할 수 있으며 약간 더 큽니다
ufo-resonance-raw-shard=__ITEM__ufo-resonance-raw-shard__
ufo-resonance-shard=__ITEM__ufo-resonance-shard__
ufo-inhibitor=__ENTITY__ufo-inhibitor__는 __ENTITY__fulgoran-ruin-vault__를 수동으로 해체할 때 감지기를 교란하여 수호자로부터 보호를 제공합니다

