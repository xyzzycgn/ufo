[mod-name]
ufo=풀고란 물체 사용 (U.F.O.)

[mod-description]
ufo=풀고란인들에게 무슨 일이 일어났는지, 혹은 그들의 기술을 어떻게 유용하게 활용할 수 있을지 궁금했던 적이 있나요?\n그렇다면 고고학 조사를 시작하고 더 깊이 파보세요. 그러면 답을 얻게 될 것입니다.\n\n하지만 조심하세요—건드리지 않는 편이 더 나았을 무언가를 발견하게 될지도 모릅니다.

[mod-setting-name]
ufo-logLevel=로그 레벨 선택
ufo-mined-ruin-vaults-needed=__ENTITY__fulgoran-ruin-vault__ 개수
ufo-frd-vaults-color=__ENTITY__fulgoran-ruin-vault__ 색상
ufo-frd-shard-color=__ENTITY__fe_resonance_shard__ 색상
ufo-frd-scan-radius=F.R.D. 스캔 반경
ufo-frd-bg-color=F.R.D.의 배경색
ufo-frd-free-bg-color=F.R.D.의 사용자 지정 배경색을 설정합니다.

[mod-setting-description]
ufo-logLevel=이 로그 레벨 이상인 모든 호출이 기록됩니다 (FATAL이 가장 높고, FINEST가 가장 낮음)
ufo-mined-ruin-vaults-needed=__ENTITY__ufo-adapter__ 기술을 연구하기 위해 채굴해야 하는 __ENTITY__fulgoran-ruin-vault__ 수입니다.
ufo-frd-vaults-color=__ENTITY__fulgoran-ruin-vault__ 이 __ITEM__ufo-detector-equipment__ 에 표시될 때의 색상
ufo-frd-shard-color=__ENTITY__fe_resonance_shard__ 이 __ITEM__ufo-detector-equipment__ 에 표시될 때의 색상
ufo-frd-scan-radius=__ITEM__ufo-detector-equipment__ 이 유물을 감지할 수 있는 반경
ufo-frd-bg-color=F.R.D. 배경색 선택.
ufo-frd-free-bg-color=[font=default-semibold][color=red]선택한 배경색이 "사용자 지정"인 경우에만 효과적입니다[/color][/font]

[string-mod-setting]
ufo-frd-bg-color-GREEN=녹색
ufo-frd-bg-color-AMBER=호박색
ufo-frd-bg-color-FREE=사용자 지정

[string-mod-setting-description]
ufo-frd-bg-color-FREE=F.R.D.의 배경색을 자유롭게 선택할 수 있도록 허용

