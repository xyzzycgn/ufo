[mod-name]
ufo=Usa oggetti fulgorani (U.F.O.)

[mod-description]
ufo=Ti sei mai chiesto cosa sia successo ai Fulgorani o come la loro tecnologia potrebbe essere utilizzata al meglio?\nAllora dovresti iniziare delle indagini archeologiche e scavare più a fondo; otterrai le risposte.\n\nMa attenzione: potresti imbatterti in qualcosa che sarebbe stato meglio lasciare in pace.

