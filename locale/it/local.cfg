[entity-description]
ufo-adapter=Consente l'uso diretto di oggetti fulgorani o l'impiego del know-how fulgorano nella costruzione di impianti migliorati.
ufo-adaptees=__1__ con __ENTITY__ufo-adapter__ è in grado di collegarsi a un __ENTITY__fulgoran-ruin-attractor__.
ufo-adapted-attractor=__ENTITY__fulgoran-ruin-attractor__ collegato a un palo elettrico con un __ENTITY__ufo-adapter__.
ufo-electromagnetic-plant=La __ENTITY__electromagnetic-plant__ migliorata con il know-how fulgorano è più compatta ed efficiente.
ufo-recycler=Il riciclatore migliorato è più compatto.
ufo-beacon=Il __ENTITY__beacon__ migliorato è più piccolo e più potente.
ufo-crusher=Il __ENTITY__ufo-crusher__ può essere costruito solo sui pianeti.
ufo-inhibitor=__ENTITY__ufo-inhibitor__ fornisce protezione durante l'estrazione manuale di un __ENTITY__fulgoran-ruin-vault__
ufo-electric-furnace=Il __ENTITY__ufo-electric-furnace migliorato richiede meno spazio, è più veloce e più pulito.
ufo-electrodynamic-fragmentation-device=Utilizza la frammentazione elettrodinamica (EDF) per la separazione selettiva di materiali compositi.

[factoriopedia-description]
ufo-adapted-attractor=Secondo la leggenda, il __ENTITY__fulgoran-ruin-attractor__ ha un'efficienza superiore. Questa può essere sfruttata con il __ENTITY__ufo-adapter__.
ufo-electromagnetic-plant=Utilizzando il know-how fulgorano, la __ENTITY__electromagnetic-plant__ migliorata richiede meno spazio ed è più efficiente.
ufo-detector-equipment=Il Rilevatore di Reliquie Fulgorane (F.R.D.) può essere installato in vari veicoli e aiuta nella ricerca di specifiche reliquie fulgorane.
ufo-recycler=Utilizzando il know-how fulgorano, il __ENTITY__recycler__ migliorato può essere costruito in modo più compatto e consuma meno energia.
ufo-beacon=Utilizzando il know-how fulgorano, il __ENTITY__beacon__ migliorato richiede meno spazio, ha una portata maggiore e più slot per i moduli.
ufo-pimp-my-car=__ENTITY__car__ potenziata con una piccola griglia di equipaggiamento in cui possono essere montati [item=ufo-detector-equipment] e una piccola alimentazione
ufo-tech=Chiave per accedere alla tecnologia fulgorana
ufo-adapter=Ponte centrale tra la tecnologia fulgorana e le tecnologie proprie
ufo-crusher=Il __ENTITY__ufo-crusher__ può essere costruito solo sui pianeti ed è leggermente più grande
ufo-resonance-raw-shard=__ITEM__ufo-resonance-raw-shard__
ufo-resonance-shard=__ITEM__ufo-resonance-shard__
ufo-inhibitor=L'__ENTITY__ufo-inhibitor__ fornisce protezione dal Guardiano quando si smantella manualmente un __ENTITY__fulgoran-ruin-vault__ disturbando i suoi sensori, ma richiede un'alimentazione costante.
ufo-electric-furnace=Il __ENTITY__ufo-electric-furnace migliorato è superiore al suo predecessore sotto ogni aspetto. Richiede meno spazio, funziona più velocemente e produce meno inquinamento, pur essendo più produttivo.
ufo-electrodynamic-fragmentation-device=Un riciclatore elettrodinamico utilizza la frammentazione elettrodinamica (EDF), un processo di separazione selettiva avanzato, per recuperare i componenti solidi dai materiali compositi.
ufo-sand-from-concrete-rubble=Recupero di sabbia da detriti di cemento mediante frammentazione elettrodinamica (EDF)

