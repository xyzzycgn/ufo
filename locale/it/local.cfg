[technology-description]
ufo-archeological-tech=Le indagini archeologiche consentono di ottenere informazioni sulla tecnologia fulgorana durante l'estrazione [font=default-semibold][color=green]manuale[/color][/font] di un __ENTITY__fulgoran-ruin-vault__, che possono poi essere utilizzate per sviluppare ulteriormente le proprie tecnologie.
ufo-tech=L'efficienza di un __ENTITY__fulgoran-ruin-attractor__ è leggendaria. I pali elettrici dotati di un __ENTITY__ufo-adapter__ possono collegarsi ad essi.
ufo-fulgoran-know-how-tech=Consente l'uso del know-how fulgorano per migliorare le proprie tecnologie
ufo-emp-tech=Consente la costruzione della __ENTITY__electromagnetic-plant__ migliorata
ufo-recycling-tech=Consente la costruzione di __ENTITY__ufo-recycler__
ufo-effect-transmission-tech=Consente la costruzione di __ENTITY__ufo-beacon__
ufo-detector-equipment-tech=Il Rilevatore di Reliquie Fulgorane (F.R.D.) aiuta nella ricerca di determinate reliquie fulgorane
ufo-pimp-my-car-tech=Estende la __ENTITY__car__ con una piccola griglia di equipaggiamento in cui possono essere montati un [item=ufo-detector-equipment] e una piccola alimentazione
ufo-resonance-raw-shard-tech=__ITEM__ufo-resonance-raw-shard__ è la base di tecnologie più avanzate che utilizzano il know-how fulgorano
ufo-resonance-shard-tech=parte più importante del __ENTITY__ufo-inhibitor__
ufo-inhibitor-tech=protegge una piccola area
ufo-electric-furnace-tech=Enables the construction of __ENTITY__ufo-electric-furnace__
ufo-electrodynamic-fragmentation-tech=Frammentazione elettrodinamica (EDF), un metodo avanzato per la separazione selettiva di materiali compositi

