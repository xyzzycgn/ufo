[technology-description]
ufo-archeological-tech=Археологические исследования позволяют получать информацию о фулгорианских технологиях во время [font=default-semibold][color=green]ручной[/color][/font] добычи __ENTITY__fulgoran-ruin-vault__, которую затем можно использовать для дальнейшего развития собственных технологий.
ufo-tech=Эффективность __ENTITY__fulgoran-ruin-attractor__ легендарна. Электрические столбы, оснащённые __ENTITY__ufo-adapter__, могут подключаться к ним.
ufo-fulgoran-know-how-tech=Позволяет использовать фулгорианские знания для улучшения собственных технологий
ufo-emp-tech=Позволяет строить улучшенную __ENTITY__electromagnetic-plant__
ufo-recycling-tech=Позволяет строить __ENTITY__ufo-recycler__
ufo-effect-transmission-tech=Позволяет строить __ENTITY__ufo-beacon__
ufo-detector-equipment-tech=Детектор фулгорианских реликвий (F.R.D.) помогает в поиске определённых фулгорианских реликвий
ufo-pimp-my-car-tech=Расширяет __ENTITY__car__, добавляя маленькую сетку оборудования, в которую можно установить [item=ufo-detector-equipment] и небольшой источник питания
ufo-resonance-raw-shard-tech=__ITEM__ufo-resonance-raw-shard__ является основой более продвинутых технологий, использующих фулгорианские знания
ufo-resonance-shard-tech=важнейшая часть __ENTITY__ufo-inhibitor__
ufo-inhibitor-tech=защищает небольшую область

[description]
ufo-tech=разблокируется после [font=default-semibold][color=green]ручной[/color][/font] добычи [font=default-semibold][color=green]__1__[/color][/font] __ENTITY__fulgoran-ruin-vault__
ufo-fulgoran-know-how-tech=разблокируется после [font=default-semibold][color=green]ручной[/color][/font] добычи [font=default-semibold][color=green]__1__[/color][/font] __ENTITY__fulgoran-ruin-vault__
