[mod-name]
ufo=Используйте фулгорианские объекты (U.F.O.)

[mod-description]
ufo=Вы когда-нибудь задумывались, что случилось с фулгорианами или как можно с пользой применить их технологии?\nЧто ж, тогда вам стоит начать археологические исследования и копнуть глубже; вы получите ответы.\n\nНо будьте осторожны — вы можете наткнуться на то, что лучше было бы оставить в покое.

[mod-setting-name]
ufo-logLevel=выбрать уровень журнала
ufo-mined-ruin-vaults-needed=количество __ENTITY__fulgoran-ruin-vault__
ufo-frd-vaults-color=цвет для __ENTITY__fulgoran-ruin-vault__
ufo-frd-shard-color=цвет для __ENTITY__fe_resonance_shard__
ufo-frd-scan-radius=радиус сканирования F.R.D.
ufo-frd-bg-color=цвет фона для F.R.D.
ufo-frd-free-bg-color=установить пользовательский цвет фона для F.R.D.

[mod-setting-description]
ufo-logLevel=все вызовы с этим уровнем журнала или выше будут записываться в журнал (FATAL — самый высокий, FINEST — самый низкий уровень)
ufo-mined-ruin-vaults-needed=Количество __ENTITY__fulgoran-ruin-vault__, которые нужно добыть, чтобы исследовать технологию __ENTITY__ufo-adapter__.
ufo-frd-vaults-color=цвет, которым __ENTITY__fulgoran-ruin-vault__ отображается в __ITEM__ufo-detector-equipment__
ufo-frd-shard-color=цвет, которым __ENTITY__fe_resonance_shard__ отображается в __ITEM__ufo-detector-equipment__
ufo-frd-scan-radius=Радиус, в пределах которого __ITEM__ufo-detector-equipment__ может обнаруживать реликвии
ufo-frd-bg-color=выбрать цвет фона F.R.D.
ufo-frd-free-bg-color=[font=default-semibold][color=red]Действует только в том случае, если выбран цвет фона "пользовательский".[/color][/font]

[string-mod-setting]
ufo-frd-bg-color-GREEN=зелёный
ufo-frd-bg-color-AMBER=янтарный
ufo-frd-bg-color-FREE=пользовательский

[string-mod-setting-description]
ufo-frd-bg-color-FREE=разрешить выбор произвольного цвета фона для F.R.D.

[equipment-name]
ufo-detector-equipment=__ITEM__ufo-detector-equipment__

[entity-name]
ufo-adapter=Адаптер U.F.O.
ufo-adaptees=__1__ с __ENTITY__ufo-adapter__
ufo-adapted-attractor=__ENTITY__fulgoran-ruin-attractor__
ufo-electromagnetic-plant=улучшенный __ENTITY__electromagnetic-plant__
ufo-recycler=улучшенный __ENTITY__recycler__
ufo-beacon=улучшенный __ENTITY__beacon__
ufo-pimp-my-car=__ENTITY__car__ с маленькой сеткой оборудования
ufo-crusher=планетарный __ENTITY__crusher__
ufo-inhibitor=ингибитор
ufo-fulgoran-ruin-vault=__ENTITY__fulgoran-ruin-vault__

[entity-description]
ufo-adapter=Позволяет напрямую использовать фулгорианские объекты или применять фулгорианские знания при строительстве улучшенных сооружений.
ufo-adaptees=__1__ с __ENTITY__ufo-adapter__ может подключаться к __ENTITY__fulgoran-ruin-attractor__.
ufo-adapted-attractor=__ENTITY__fulgoran-ruin-attractor__, подключённый к электрическому столбу с __ENTITY__ufo-adapter__.
ufo-electromagnetic-plant=__ENTITY__electromagnetic-plant__, улучшенная с помощью фулгорианских знаний, более компактна и эффективна.
ufo-recycler=Улучшенный переработчик более компактен.
ufo-beacon=Улучшенный __ENTITY__beacon__ меньше и мощнее.
ufo-crusher=__ENTITY__ufo-crusher__ можно строить только на планетах.
ufo-inhibitor=__ENTITY__ufo-inhibitor__ обеспечивает защиту при ручной добыче __ENTITY__fulgoran-ruin-vault__

[factoriopedia-description]
ufo-adapted-attractor=Согласно легенде, __ENTITY__fulgoran-ruin-attractor__ обладает превосходной эффективностью. Это можно использовать с помощью __ENTITY__ufo-adapter__.
ufo-electromagnetic-plant=При использовании фулгорианских знаний улучшенная __ENTITY__electromagnetic-plant__ требует меньше места и работает эффективнее.
ufo-detector-equipment=Детектор фулгорианских реликвий (F.R.D.) можно устанавливать на различные транспортные средства, и он помогает в поиске определённых фулгорианских реликвий.
ufo-recycler=При использовании фулгорианских знаний улучшенный __ENTITY__recycler__ можно построить более компактным, и он потребляет меньше энергии.
ufo-beacon=При использовании фулгорианских знаний улучшенный __ENTITY__beacon__ требует меньше места, имеет увеличенный радиус действия и больше слотов для модулей.
ufo-pimp-my-car=Улучшенный __ENTITY__car__ с маленькой сеткой оборудования, в которую можно установить [item=ufo-detector-equipment] и небольшой источник питания
ufo-tech=Ключ к доступу к фулгорианским технологиям
ufo-adapter=Центральный мост между фулгорианскими и собственными технологиями
ufo-crusher=__ENTITY__ufo-crusher__ можно строить только на планетах, и он немного больше
ufo-resonance-raw-shard=__ITEM__ufo-resonance-raw-shard__
ufo-resonance-shard=__ITEM__ufo-resonance-shard__
ufo-inhibitor=__ENTITY__ufo-inhibitor__ обеспечивает защиту от Стража при ручном демонтаже __ENTITY__fulgoran-ruin-vault__, заглушая его сенсоры

