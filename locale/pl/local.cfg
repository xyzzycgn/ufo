[technology-description]
ufo-archeological-tech=Badania archeologiczne umożliwiają zdobywanie informacji o fulgurańskiej technologii podczas [font=default-semibold][color=green]ręcznego[/color][/font] wydobywania __ENTITY__fulgoran-ruin-vault__, które następnie można wykorzystać do dalszego rozwijania własnych technologii
ufo-tech=Wydajność __ENTITY__fulgoran-ruin-attractor__ jest legendarna. Słupy energetyczne wyposażone w __ENTITY__ufo-adapter__ mogą się z nim łączyć.
ufo-fulgoran-know-how-tech=umożliwia wykorzystanie fulgurańskiego know-how do ulepszania własnych technologii
ufo-emp-tech=Umożliwia budowę ulepszonej __ENTITY__electromagnetic-plant__
ufo-recycling-tech=Umożliwia budowę __ENTITY__ufo-recycler__
ufo-effect-transmission-tech=Umożliwia budowę __ENTITY__ufo-beacon__
ufo-detector-equipment-tech=Detektor Fulgurańskich Reliktów (F.R.D.) wspiera poszukiwania określonych fulgurańskich reliktów
ufo-pimp-my-car-tech=rozszerza __ENTITY__car__ o małą siatkę wyposażenia, w której można zamontować [item=ufo-detector-equipment] oraz małe źródło zasilania
ufo-resonance-raw-shard-tech=__ITEM__ufo-resonance-raw-shard__ stanowi podstawę bardziej zaawansowanych technologii wykorzystujących fulgurańskie know-how
ufo-resonance-shard-tech=najważniejsza część __ENTITY__ufo-inhibitor__
ufo-inhibitor-tech=chroni niewielki obszar
ufo-electric-furnace-tech=Umożliwia budowę __ENTITY__ufo-electric-furnace__
ufo-electrodynamic-fragmentation-tech=Fragmentacja elektrodynamiczna (EDF) to zaawansowana metoda selektywnego rozdzielania materiałów kompozytowych poprzez zastosowanie bardzo krótkich wyładowań wysokiego napięcia pod wodą. Z tego powodu proces wymaga stosunkowo dużych ilości wody, ale większość z niej może być ponownie użyta w zamkniętym obiegu, co czyni go bardzo zasobooszczędnym.

