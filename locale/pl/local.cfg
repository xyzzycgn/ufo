[entity-description]
ufo-adapter=Umożliwia bezpośrednie użycie fulgurańskich obiektów lub wykorzystanie fulgurańskiego know-how przy budowie ulepszonych urządzeń
ufo-adaptees=__1__ z __ENTITY__ufo-adapter__ jest w stanie połączyć się z __ENTITY__fulgoran-ruin-attractor__
ufo-adapted-attractor=__ENTITY__fulgoran-ruin-attractor__ podłączony do słupa energetycznego z __ENTITY__ufo-adapter__
ufo-electromagnetic-plant=Ulepszona dzięki fulgurańskiemu know-how __ENTITY__electromagnetic-plant__ jest bardziej kompaktowa i wydajniejsza
ufo-recycler=ulepszony recycler ma bardziej kompaktową konstrukcję
ufo-beacon=ulepszony __ENTITY__beacon__ jest mniejszy i potężniejszy
ufo-crusher=__ENTITY__ufo-crusher__ można zbudować tylko na planetach
ufo-inhibitor=__ENTITY__ufo-inhibitor__ zapewnia ochronę podczas ręcznego wydobywania __ENTITY__fulgoran-ruin-vault__
ufo-electric-furnace=Ulepszony __ENTITY__ufo-electric-furnace__ zajmuje mniej miejsca, działa szybciej i jest czystszy.
ufo-electrodynamic-fragmentation-device=Wykorzystuje fragmentację elektrodynamiczną (EDF) do selektywnego rozdzielania materiałów kompozytowych.

[factoriopedia-description]
ufo-adapted-attractor=Według legend __ENTITY__fulgoran-ruin-attractor__ ma wyjątkową wydajność. Można ją wykorzystać za pomocą __ENTITY__ufo-adapter__.
ufo-electromagnetic-plant=Dzięki wykorzystaniu fulgurańskiego know-how ulepszona __ENTITY__electromagnetic-plant__ zajmuje mniej miejsca i jest wydajniejsza.
ufo-detector-equipment=Detektor Fulgurańskich Reliktów (F.R.D.) można zamontować w różnych pojazdach i wspiera on poszukiwania określonych fulgurańskich reliktów
ufo-recycler=Dzięki wykorzystaniu fulgurańskiego know-how ulepszony __ENTITY__recycler__ można zbudować bardziej kompaktowo i zużywa mniej energii.
ufo-beacon=Dzięki wykorzystaniu fulgurańskiego know-how ulepszony __ENTITY__beacon__ zajmuje mniej miejsca, ma większy zasięg i więcej gniazd modułów.
ufo-pimp-my-car=Rozbudowany __ENTITY__car__ z małą siatką wyposażenia, w której można zamontować [item=ufo-detector-equipment] oraz małe źródło zasilania
ufo-tech=Klucz do dostępu do fulgurańskiej technologii
ufo-adapter=Centralny pomost między fulgurańskimi i własnymi technologiami
ufo-crusher=__ENTITY__ufo-crusher__ można zbudować tylko na planetach i jest nieco większy
ufo-resonance-raw-shard=__ITEM__ufo-resonance-raw-shard__
ufo-resonance-shard=__ITEM__ufo-resonance-shard__
ufo-inhibitor=__ENTITY__ufo-inhibitor__ zapewnia ochronę przed Strażnikiem podczas ręcznego wydobywania __ENTITY__fulgoran-ruin-vault__, zakłócając jego sensory, ale wymaga stałego zasilania.
ufo-electric-furnace=Ulepszony __ENTITY__ufo-electric-furnace__ przewyższa swojego poprzednika pod każdym względem. Zajmuje mniej miejsca, działa szybciej i powoduje mniejsze zanieczyszczenie, a przy tym jest wydajniejszy.
ufo-electrodynamic-fragmentation-device=Elektrodynamiczny recycler wykorzystuje fragmentację elektrodynamiczną (EDF), zaawansowany proces selektywnej separacji, do odzyskiwania stałych składników z materiałów kompozytowych.
ufo-sand-from-concrete-rubble=Odzyskiwanie piasku z gruzu betonowego przy użyciu fragmentacji elektrodynamicznej (EDF)

