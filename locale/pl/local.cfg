[mod-name]
ufo=Użyj fulgurańskich obiektów (U.F.O.)

[mod-description]
ufo=Czy zawsze zastanawiało Cię, co stało się z Fulgoranami albo jak można pożytecznie wykorzystać ich technologię?\nW takim razie powinieneś rozpocząć badania archeologiczne i kopać głębiej, a otrzymasz odpowiedzi.\n\nAle uwaga - możesz natrafić na coś, co lepiej było zostawić w spokoju.

