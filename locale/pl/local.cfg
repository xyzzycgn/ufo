[achievement-description]
ufo-rookie-archaeologist=Nawet najsłynniejsi archeolodzy zaczynali od małych rzeczy. Zbadaj [technology=ufo-resonance-raw-shard-tech]
ufo-senior-archaeologist=Praktyka czyni mistrza i opanuj eksplorację [technology=ufo-tech]
ufo-experienced-archaeologist=Kopaj jak słynny archeolog, nie bój się niebezpieczeństw i badaj [technology=ufo-fulgoran-know-how-tech]

