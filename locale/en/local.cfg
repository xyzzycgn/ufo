[mod-name]
ufo=Use fulguran objects (U.F.O.)

[mod-description]
ufo=Have you ever wondered what happened to the Fulgorans or how their technology could be put to good use?\nWell, then you should start archaeological investigations and dig deeper; you'll get the answers.\n\nBut beware—you might stumble upon something you'd have been better off leaving alone.

[mod-setting-name]
ufo-logLevel=choose log level
ufo-mined-ruin-vaults-needed=number of __ENTITY__fulgoran-ruin-vault__
ufo-frd-vaults-color=color for __ENTITY__fulgoran-ruin-vault__
ufo-frd-shard-color=color for __ENTITY__fe_resonance_shard__
ufo-frd-scan-radius=scan radius F.R.D.
ufo-frd-bg-color=background color for F.R.D.
ufo-frd-free-bg-color=set custom background color for F.R.D.

[mod-setting-description]
ufo-logLevel=all calls with this log level or higher will be logged (FATAL is the highest, FINEST the lowest level)
ufo-mined-ruin-vaults-needed=Number of __ENTITY__fulgoran-ruin-vault__ that need to be mined to research the __ENTITY__ufo-adapter__ technology.
ufo-frd-vaults-color=color with which an __ENTITY__fulgoran-ruin-vault__ is displayed in the __ITEM__ufo-detector-equipment__
ufo-frd-shard-color=color with which an __ENTITY__fe_resonance_shard__ is displayed in the __ITEM__ufo-detector-equipment__
ufo-frd-scan-radius=Radius within which the __ITEM__ufo-detector-equipment__ can detect relics
ufo-frd-bg-color=choose F.R.D. background color.
ufo-frd-free-bg-color=[font=default-semibold][color=red]only effective if the selected background color is "custom"[/color][/font]

[string-mod-setting]
ufo-frd-bg-color-GREEN=green
ufo-frd-bg-color-AMBER=amber
ufo-frd-bg-color-FREE=custom

[string-mod-setting-description]
ufo-frd-bg-color-FREE=allow choice of an arbitrary background color for the F.R.D.

