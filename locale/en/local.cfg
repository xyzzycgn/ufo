[factoriopedia-description]
ufo-adapted-attractor=According to legend, the __ENTITY__fulgoran-ruin-attractor__ has superior efficiency. This can be utilized with the __ENTITY__ufo-adapter__.
ufo-electromagnetic-plant=By utilizing Fulguran know-how, the improved __ENTITY__electromagnetic-plant__ requires less space and is more efficient.
ufo-detector-equipment=The Fulguran Relic Detector (F.R.D.) can be installed in various vehicles and assists in the search for specific Fulguran relics.
ufo-recycler=By utilizing Fulguran know-how, the improved __ENTITY__recycler__ can be built more compactly and consumes less energy.
ufo-beacon=By utilizing Fulguran know-how, the improved __ENTITY__beacon__ requires less space, has an increased range, and more module slots.
ufo-pimp-my-car=Upgraded __ENTITY__car__ with a small equipment grid that can mount [item=ufo-detector-equipment] and a small power supply
ufo-tech=Key to accessing Fulgoran technology
ufo-adapter=Central bridge between Fulgoran and own technologies
ufo-crusher=The __ENTITY__ufo-crusher__ can only be built on planets and is slightly larger
ufo-resonance-raw-shard=__ITEM__ufo-resonance-raw-shard__
ufo-resonance-shard=__ITEM__ufo-resonance-shard__
ufo-inhibitor=__ENTITY__ufo-inhibitor__ provides protection from the Guardian when manually dismantling a __ENTITY__fulgoran-ruin-vault__ by jamming its sensors

