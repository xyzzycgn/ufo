[entity-description]
ufo-adapter=Allows the direct use of Fulgoran objects or the use of Fulgoran know-how in the construction of improved facilities.
ufo-adaptees=__1__ mit __ENTITY__ufo-adapter__ is able to connect to a __ENTITY__fulgoran-ruin-attractor__.
ufo-adapted-attractor=__ENTITY__fulgoran-ruin-attractor__ connected to a power pole with an __ENTITY__ufo-adapter__.
ufo-electromagnetic-plant=The __ENTITY__electromagnetic-plant__ improved with Fulgoran know-how is more compact and efficient.
ufo-recycler=The improved recycler is more compact.
ufo-beacon=The improved __ENTITY__beacon__ is smaller and more powerful.
ufo-crusher=The __ENTITY__ufo-crusher__ can only be built on planets. will be
