[technology-description]
ufo-archeological-tech=Archaeological investigations allow the acquisition of informations on Fulgoran technology during the [font=default-semibold][color=green]manual[/color][/font] mining of a __ENTITY__fulgoran-ruin-vault__, that can then be used to further develop one's own technologies.
ufo-tech=The efficiency of an __ENTITY__fulgoran-ruin-attractor__ is legendary. Power poles equipped with an __ENTITY__ufo-adapter__ can connect to them.
ufo-fulgoran-know-how-tech=Enables the use of Fulgoran know-how to improve one's own technologies
ufo-emp-tech=Enables the construction of the improved __ENTITY__electromagnetic-plant__
ufo-recycling-tech=Enables the construction of __ENTITY__ufo-recycler__
ufo-effect-transmission-tech=Enables the construction of __ENTITY__ufo-beacon__
ufo-detector-equipment-tech=Fulguran Relic Detector (F.R.D.) assists in the search for certain Fulguran relics
ufo-pimp-my-car-tech=Extends the __ENTITY__car__ with a small equipment grid in which an [item=ufo-detector-equipment] and a small power supply are mounted can
ufo-resonance-raw-shard-tech=__ITEM__ufo-resonance-raw-shard__ is the basis of more advanced technologies that utilize Fulguran know-how
ufo-resonance-shard-tech=most important part of the __ENTITY__ufo-inhibitor__
ufo-inhibitor-tech=protects a small area

