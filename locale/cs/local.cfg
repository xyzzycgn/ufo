[mod-name]
ufo=Používej fulguranské objekty (U.F.O.)

[mod-description]
ufo=Už ses někdy ptal, co se stalo s Fulgorany nebo jak by se jejich technologie dala užitečně využít?\nPak bys měl zahájit archeologický výzkum a kopat hlouběji; odpovědi dostaneš.\n\nAle pozor - můžeš narazit na něco, co by bylo lepší nechat být.

