ufo-pimp-my-car-tech=Rozšiřuje __ENTITY__car__ o malou mřížku vybavení, do které lze namontovat [item=ufo-detector-equipment] a malý zdroj energie
ufo-resonance-raw-shard-tech=__ITEM__ufo-resonance-raw-shard__ je základem pokročilejších technologií, které využívají fulguranské know-how
