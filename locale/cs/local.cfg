ufo-detector-equipment=Detektor fulguranských relikvií (F.R.D.) lze nainstalovat do různých vozidel a pomáhá při hledání určitých fulguranských relikvií.
ufo-recycler=Využitím fulguranského know-how lze vylepšený __ENTITY__recycler__ postavit kompaktněji a spotřebovává méně energie.
ufo-beacon=Využitím fulguranského know-how vyžaduje vylepšený __ENTITY__beacon__ méně místa, má větší dosah a více slotů pro moduly.
ufo-pimp-my-car=Vylepšený __ENTITY__car__ s malou mřížkou vybavení, do které lze namontovat [item=ufo-detector-equipment] a malý zdroj energie
ufo-tech=Klíč k přístupu k fulguranské technologii
ufo-adapter=Centrální most mezi fulguranskými a vlastními technologiemi
ufo-crusher=__ENTITY__ufo-crusher__ lze postavit pouze na planetách a je o něco větší
