ufo-tech=Účinnost __ENTITY__fulgoran-ruin-attractor__ je legendární. Sloupy elektrického vedení vybavené __ENTITY__ufo-adapter__ se k nim mohou připojit.
ufo-fulgoran-know-how-tech=Umožňuje využívat fulguranské know-how ke zlepšování vlastních technologií
