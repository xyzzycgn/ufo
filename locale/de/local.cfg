[mod-name]
ufo=Nutze fulguranische Objekte (U.F.O.)

[mod-description]
ufo=Du hast Dich schon immer gefragt, was mit den Fulgoranern passiert ist oder wie man ihre Technik nutzvoll einsetzen kann?\nNun, dann solltest Du archäologische Untersuchungen starten und tiefer graben, dann erhältst Du die Antworten.\n\nDoch Achtung - es könnte sein, dass Du dabei auf etwas stößt, das Du besser in Ruhe gelassen hättest.

