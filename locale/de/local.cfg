[technology-description]
ufo-archeological-tech=Archäologische Untersuchungen ermöglichen es, beim [font=default-semibold][color=green]manuellen[/color][/font] Abbau einer __ENTITY__fulgoran-ruin-vault__ Informationen zur fulgoranischen Technik zu bekommen, die anschließend verwendet werden können, um eigene Technologien weiterzuentwickeln
ufo-tech=Die Effizienz eines __ENTITY__fulgoran-ruin-attractor__ ist legendär. Mit einem __ENTITY__ufo-adapter__ können sich Strommasten mit ihnen verbinden.
ufo-fulgoran-know-how-tech=ermöglicht die Verwendung fulgoranischen Know Hows zur Verbesserung eigener Technologien
ufo-emp-tech=Ermöglicht den Bau der verbesserten __ENTITY__electromagnetic-plant__
ufo-recycling-tech=Ermöglicht den Bau von __ENTITY__ufo-recycler__
ufo-effect-transmission-tech=Ermöglicht den Bau __ENTITY__ufo-beacon__
ufo-detector-equipment-tech=Fulguranische Relikte Detektor (F.R.D.) unterstützt bei der Suche nach bestimmten fulguranischen Relikten
ufo-pimp-my-car-tech=erweitert das __ENTITY__car__ mit einem kleinen Ausrüstungsgitter, in dem ein [item=ufo-detector-equipment] und eine kleine Energieversorgung montiert werden können
ufo-resonance-raw-shard-tech=__ITEM__ufo-resonance-raw-shard__ ist Grundlage der fortgeschritteneren Technologien, die fulguranisches Know How nutzen
ufo-resonance-shard-tech=wichtigstes Teil des __ENTITY__ufo-inhibitor__
ufo-inhibitor-tech=beschützt einen kleinen Bereich
ufo-electric-furnace-tech=Ermöglicht den Bau von __ENTITY__ufo-electric-furnace__

