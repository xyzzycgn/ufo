ufo-mined-ruin-vaults-needed=Anzahl der __ENTITY__fulgoran-ruin-vault__, die abgebaut werden müssen, um die Technologie __ENTITY__ufo-adapter__ zu erforschen
ufo-frd-vaults-color=Farbe mit der ein __ENTITY__fulgoran-ruin-vault__ im __ITEM__ufo-detector-equipment__ angezeigt wird
ufo-frd-shard-color=Farbe mit der ein __ENTITY__fe_resonance_shard__ im __ITEM__ufo-detector-equipment__ angezeigt wird
ufo-frd-scan-radius=Radius innerhalb dessen der __ITEM__ufo-detector-equipment__ Relikte erfassen kann
