[entity-description]
ufo-adapter=Ermöglicht es, fulguranische Objekte direkt zu verwenden oder fulgoranisches Know How bei der Konstruktion verbesserter Anlagen zu nutzen
ufo-adaptees=__1__ mit __ENTITY__ufo-adapter__ ist in der Lage, sich mit einem __ENTITY__fulgoran-ruin-attractor__ zu verbinden
ufo-adapted-attractor=__ENTITY__fulgoran-ruin-attractor__ angeschlossen an Strommast mit __ENTITY__ufo-adapter__
ufo-electromagnetic-plant=Die mit fulguranischem Know-How verbesserte __ENTITY__electromagnetic-plant__ ist kompakter und effizienter
ufo-recycler=der verbesserte Recycler ist kompakter gebaut
ufo-beacon=der verbesserte __ENTITY__beacon__ ist kleiner und leistungsstärker
ufo-crusher=der __ENTITY__ufo-crusher__ kann nur auf Planeten gebaut werden
ufo-inhibitor=__ENTITY__ufo-inhibitor__ bietet Schutz beim manuellen Abbau einer __ENTITY__fulgoran-ruin-vault__
ufo-electric-furnace=Der verbesserte __ENTITY__ufo-electric-furnace__ braucht weniger Platz, ist schneller und sauberer

[factoriopedia-description]
ufo-adapted-attractor=Legenden zufolge hat der __ENTITY__fulgoran-ruin-attractor__ eine überlegene Effizienz. Mit dem __ENTITY__ufo-adapter__ kann diese genutzt werden.
ufo-electromagnetic-plant=Durch die Verwendung fulguranischen Know Hows benötigt die verbesserte __ENTITY__electromagnetic-plant__  weniger Platz und ist effizienter.
ufo-detector-equipment=Fulguranische Relikte Detektor (F.R.D.) kann in verschiedene Fahrzeuge eingebaut werden und unterstützt bei der Suche nach bestimmten fulguranischen Relikten
ufo-recycler=Durch die Verwendung fulguranischen Know Hows kann der verbesserte __ENTITY__recycler__ kompakter gebaut werden und verbraucht weniger Energie.
ufo-beacon=Durch die Verwendung fulguranischen Know Hows benötigt der verbesserte __ENTITY__beacon__ weniger Platz, hat eine erhöhte Reichweite und mehr Modulplätze.
ufo-pimp-my-car=Erweitertes __ENTITY__car__ mit einem kleinen Ausrüstungsgitter, in dem ein [item=ufo-detector-equipment] und eine kleine Energieversorgung montiert werden können
ufo-tech=Schlüssel zum Zugriff auf fulgoranische Technologie
ufo-adapter=Zentrale Brücke zwischen fulguranischen und eigenen Technologien
ufo-crusher=der __ENTITY__ufo-crusher__ kann nur auf Planeten gebaut werden und ist etwas größer
ufo-resonance-raw-shard=__ITEM__ufo-resonance-raw-shard__
ufo-resonance-shard=__ITEM__ufo-resonance-shard__
ufo-inhibitor=__ENTITY__ufo-inhibitor__ bietet Schutz vor dem Wächter beim manuellen Abbau einer __ENTITY__fulgoran-ruin-vault__, indem er seine Sensoren stört
ufo-electric-furnace=Der verbesserte __ENTITY__ufo-electric-furnace__ ist seinem Vorgänger in allen Belangen überlegen. Er braucht weniger Platz, arbeitet schneller und produziert weniger Umweltverschmutzung bei höherer Produktivität

