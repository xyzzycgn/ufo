[entity-description]
ufo-adapter=Gjør det mulig å bruke fulgorske objekter direkte eller å bruke fulgorsk kunnskap i byggingen av forbedrede anlegg.
ufo-adaptees=__1__ med __ENTITY__ufo-adapter__ kan koble seg til en __ENTITY__fulgoran-ruin-attractor__.
ufo-adapted-attractor=__ENTITY__fulgoran-ruin-attractor__ koblet til en strømstolpe med en __ENTITY__ufo-adapter__.
ufo-electromagnetic-plant=__ENTITY__electromagnetic-plant__ forbedret med fulgorsk kunnskap er mer kompakt og effektiv.
ufo-recycler=Den forbedrede resirkulereren er mer kompakt.
ufo-beacon=Den forbedrede __ENTITY__beacon__ er mindre og kraftigere.
ufo-crusher=__ENTITY__ufo-crusher__ kan bare bygges på planeter. vil bli
ufo-inhibitor=__ENTITY__ufo-inhibitor__ gir beskyttelse under manuell utvinning av en __ENTITY__fulgoran-ruin-vault__
ufo-electric-furnace=Den forbedrede __ENTITY__ufo-electric-furnace__ tar mindre plass, er raskere og renere.
ufo-electrodynamic-fragmentation-device=Bruker elektrodynamisk fragmentering (EDF) til selektiv separasjon av komposittmaterialer.

[factoriopedia-description]
ufo-adapted-attractor=Ifølge legenden har __ENTITY__fulgoran-ruin-attractor__ overlegen effektivitet. Dette kan utnyttes med __ENTITY__ufo-adapter__.
ufo-electromagnetic-plant=Ved å bruke fulgorsk kunnskap krever den forbedrede __ENTITY__electromagnetic-plant__ mindre plass og er mer effektiv.
ufo-detector-equipment=Fulgorsk relikviedetektor (F.R.D.) kan installeres i ulike kjøretøy og hjelper til i søket etter bestemte fulgorske relikvier.
ufo-recycler=Ved å bruke fulgorsk kunnskap kan den forbedrede __ENTITY__recycler__ bygges mer kompakt og bruker mindre energi.
ufo-beacon=Ved å bruke fulgorsk kunnskap krever den forbedrede __ENTITY__beacon__ mindre plass, har økt rekkevidde og flere modulplasser.
ufo-pimp-my-car=Oppgradert __ENTITY__car__ med et lite utstyrsnett som kan montere [item=ufo-detector-equipment] og en liten strømforsyning
ufo-tech=Nøkkel til tilgang til fulgorsk teknologi
ufo-adapter=Sentral bro mellom fulgorsk og egen teknologi
ufo-crusher=__ENTITY__ufo-crusher__ kan bare bygges på planeter og er litt større
ufo-resonance-raw-shard=__ITEM__ufo-resonance-raw-shard__
ufo-resonance-shard=__ITEM__ufo-resonance-shard__
ufo-inhibitor=__ENTITY__ufo-inhibitor__ gir beskyttelse mot Vokteren under manuell utvinning av et __ENTITY__fulgoran-ruin-vault__ ved å forstyrre sensorene, men krever en konstant strømforsyning.
ufo-electric-furnace=Den forbedrede __ENTITY__ufo-electric-furnace__ er bedre enn forgjengeren på alle områder. Den tar mindre plass, arbeider raskere og produserer mindre forurensning, samtidig som den har høyere produktivitet.
ufo-electrodynamic-fragmentation-device=En elektrodynamisk resirkulator bruker elektrodynamisk fragmentering (EDF), en avansert selektiv separasjonsprosess, for å gjenvinne faste komponenter fra komposittmaterialer.
ufo-sand-from-concrete-rubble=Sandgjenvinning fra betongrester ved hjelp av elektrodynamisk fragmentering (EDF)

