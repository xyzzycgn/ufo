[achievement-description]
ufo-rookie-archaeologist=Selv de mest berømte arkeologene startet i det små. Utforsk [technology=ufo-resonance-raw-shard-tech]
ufo-senior-archaeologist=Øvelse gjør mester og mestre utforskningen av [technology=ufo-tech]
ufo-experienced-archaeologist=Grav som en berømt arkeolog, frykt ingen farer, og utforsk [technology=ufo-fulgoran-know-how-tech]

