[technology-description]
ufo-archeological-tech=Arkeologiske undersøkelser gjør det mulig å få informasjon om fulgorsk teknologi under [font=default-semibold][color=green]manuell[/color][/font] utvinning av en __ENTITY__fulgoran-ruin-vault__, som deretter kan brukes til å videreutvikle egne teknologier.
ufo-tech=Effektiviteten til en __ENTITY__fulgoran-ruin-attractor__ er legendarisk. Strømstolper utstyrt med en __ENTITY__ufo-adapter__ kan koble seg til dem.
ufo-fulgoran-know-how-tech=Gjør det mulig å bruke fulgorsk kunnskap til å forbedre egne teknologier
ufo-emp-tech=Gjør det mulig å bygge den forbedrede __ENTITY__electromagnetic-plant__
ufo-recycling-tech=Gjør det mulig å bygge __ENTITY__ufo-recycler__
ufo-effect-transmission-tech=Gjør det mulig å bygge __ENTITY__ufo-beacon__
ufo-detector-equipment-tech=Fulgorsk relikviedetektor (F.R.D.) hjelper i søket etter bestemte fulgorske relikvier
ufo-pimp-my-car-tech=Utvider __ENTITY__car__ med et lite utstyrsnett der [item=ufo-detector-equipment] og en liten strømforsyning kan monteres
ufo-resonance-raw-shard-tech=__ITEM__ufo-resonance-raw-shard__ er grunnlaget for mer avanserte teknologier som bruker fulgorsk kunnskap
ufo-resonance-shard-tech=viktigste del av __ENTITY__ufo-inhibitor__
ufo-inhibitor-tech=beskytter et lite område
ufo-electric-furnace-tech=Muliggjør bygging av __ENTITY__ufo-electric-furnace__
ufo-electrodynamic-fragmentation-tech=Elektrodynamisk fragmentering (EDF) er en avansert metode for selektiv separasjon av komposittmaterialer ved bruk av svært korte høyspenningsutladninger under vann. Derfor kreves det relativt store mengder vann for prosessen, men det meste av dette kan gjenbrukes i en lukket krets, noe som gjør den svært ressursøkonomisk.

