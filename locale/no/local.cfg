[mod-name]
ufo=Bruk fulgorske objekter (U.F.O.)

[mod-description]
ufo=Har du noen gang lurt på hva som skjedde med Fulgoranerne, eller hvordan teknologien deres kunne brukes på en god måte?\nDa bør du starte arkeologiske undersøkelser og grave dypere; du vil få svarene.\n\nMen pass deg — du kan snuble over noe du helst burde ha latt være i fred.

