[mod-name]
ufo=Fulgoran tárgyak használata (U.F.O.)

[mod-description]
ufo=Elgondolkodtál már azon, mi történt a Fulgoranokkal, vagy hogyan lehetne hasznosan felhasználni a technológiájukat?\nNos, akkor érdemes régészeti kutatásokba kezdened és mélyebbre ásnod; meg fogod kapni a válaszokat.\n\nDe vigyázz — olyasmibe botolhatsz, amit jobb lett volna békén hagyni.

