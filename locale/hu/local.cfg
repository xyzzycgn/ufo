[technology-description]
ufo-archeological-tech=A régészeti kutatások lehetővé teszik, hogy információt szerezz a Fulgoran technológiáról egy __ENTITY__fulgoran-ruin-vault__ [font=default-semibold][color=green]kézi[/color][/font] bányászata során, amelyet aztán saját technológiáid továbbfejlesztésére használhatsz fel.
ufo-tech=Egy __ENTITY__fulgoran-ruin-attractor__ hatékonysága legendás. Az __ENTITY__ufo-adapter__-rel felszerelt villanyoszlopok kapcsolódhatnak hozzájuk.
ufo-fulgoran-know-how-tech=Lehetővé teszi a Fulgoran szaktudás használatát saját technológiáid fejlesztésére
ufo-emp-tech=Lehetővé teszi a fejlesztett __ENTITY__electromagnetic-plant__ megépítését
ufo-recycling-tech=Lehetővé teszi a __ENTITY__ufo-recycler__ megépítését
ufo-effect-transmission-tech=Lehetővé teszi a __ENTITY__ufo-beacon__ megépítését
ufo-detector-equipment-tech=A Fulgoran Relikvia Detektor (F.R.D.) segít bizonyos Fulgoran relikviák felkutatásában
ufo-pimp-my-car-tech=Kibővíti a __ENTITY__car__ járművet egy kis felszerelésráccsal, amelybe [item=ufo-detector-equipment] és egy kis áramforrás szerelhető
ufo-resonance-raw-shard-tech=Az __ITEM__ufo-resonance-raw-shard__ az alapja a fejlettebb, Fulgoran szaktudást használó technológiáknak
ufo-resonance-shard-tech=az __ENTITY__ufo-inhibitor__ legfontosabb része
ufo-inhibitor-tech=egy kis területet véd
ufo-electric-furnace-tech=Lehetővé teszi __ENTITY__ufo-electric-furnace__ felépítését
ufo-electrodynamic-fragmentation-tech=Az elektrodinamikus fragmentáció (EDF) egy fejlett módszer a kompozit anyagok szelektív szétválasztására nagyon rövid, nagyfeszültségű víz alatti kisülések alkalmazásával. Ezért viszonylag nagy mennyiségű víz szükséges a folyamathoz, de ennek nagy része újrahasznosítható egy zárt körben, így nagyon erőforrás-hatékony művelet.

