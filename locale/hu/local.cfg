[entity-description]
ufo-adapter=Lehetővé teszi a Fulgoran tárgyak közvetlen használatát, illetve a Fulgoran tudás alkalmazását fejlesztett létesítmények építésénél.
ufo-adaptees=Az __ENTITY__ufo-adapter__-rel ellátott __1__ képes csatlakozni egy __ENTITY__fulgoran-ruin-attractor__-hoz.
ufo-adapted-attractor=__ENTITY__fulgoran-ruin-attractor__, amely egy __ENTITY__ufo-adapter__-rel felszerelt villanyoszlophoz csatlakozik.
ufo-electromagnetic-plant=A Fulgoran tudással fejlesztett __ENTITY__electromagnetic-plant__ kompaktabb és hatékonyabb.
ufo-recycler=A fejlesztett újrahasznosító kompaktabb.
ufo-beacon=A fejlesztett __ENTITY__beacon__ kisebb és erősebb.
ufo-crusher=A __ENTITY__ufo-crusher__ csak bolygókon építhető.
ufo-inhibitor=Az __ENTITY__ufo-inhibitor__ védelmet nyújt egy __ENTITY__fulgoran-ruin-vault__ kézi kibányászása során
ufo-electric-furnace=A továbbfejlesztett __ENTITY__electric-furnace__ kevesebb helyet igényel, gyorsabb és tisztább.
ufo-electrodynamic-fragmentation-device=Elektrodinamikus fragmentációt (EDF) használ a kompozit anyagok szelektív szétválasztásához

[factoriopedia-description]
ufo-adapted-attractor=A legenda szerint a __ENTITY__fulgoran-ruin-attractor__ kiemelkedő hatékonyságú. Ez a __ENTITY__ufo-adapter__ segítségével kihasználható.
ufo-electromagnetic-plant=A Fulgoran tudás felhasználásával a fejlesztett __ENTITY__electromagnetic-plant__ kevesebb helyet igényel és hatékonyabb.
ufo-detector-equipment=A Fulgoran Relikvia Detektor (F.R.D.) különféle járművekbe szerelhető, és segít bizonyos Fulgoran relikviák felkutatásában.
ufo-recycler=A Fulgoran tudás felhasználásával a fejlesztett __ENTITY__recycler__ kompaktabban építhető meg, és kevesebb energiát fogyaszt.
ufo-beacon=A Fulgoran tudás felhasználásával a fejlesztett __ENTITY__beacon__ kevesebb helyet foglal, nagyobb hatótávval rendelkezik, és több modulfoglalata van.
ufo-pimp-my-car=Fejlesztett __ENTITY__car__ kis felszerelésráccsal, amelyre [item=ufo-detector-equipment] és egy kis áramforrás szerelhető
ufo-tech=Kulcs a Fulgoran technológiához való hozzáféréshez
ufo-adapter=Központi híd a Fulgoran és a saját technológiák között
ufo-crusher=A __ENTITY__ufo-crusher__ csak bolygókon építhető, és valamivel nagyobb
ufo-resonance-raw-shard=__ITEM__ufo-resonance-raw-shard__
ufo-resonance-shard=__ITEM__ufo-resonance-shard__
ufo-inhibitor=Az __ENTITY__ufo-inhibitor__ védelmet nyújt az Őrző ellen egy __ENTITY__fulgoran-ruin-vault__ manuális bányászata során az érzékelőinek zavarásával, de folyamatos tápellátást igényel.
ufo-electric-furnace=A továbbfejlesztett __ENTITY__electric-furnace__ minden tekintetben felülmúlja elődjét. Kevesebb helyet igényel, gyorsabban működik, és kevesebb szennyezést termel, miközben termelékenyebb.
ufo-electrodynamic-fragmentation-device=Az elektrodinamikus újrahasznosító elektrodinamikus fragmentációt (EDF), egy fejlett szelektív elválasztási eljárást használ a szilárd komponensek kinyerésére a kompozit anyagokból.
ufo-sand-from-concrete-rubble=Homok kinyerése betontörmelékből elektrodinamikus fragmentációval (EDF)

