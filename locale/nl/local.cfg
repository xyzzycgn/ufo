[technology-description]
ufo-archeological-tech=Archeologisch onderzoek maakt het mogelijk informatie over Fulgoran-technologie te verkrijgen tijdens het [font=default-semibold][color=green]handmatig[/color][/font] ontginnen van een __ENTITY__fulgoran-ruin-vault__, die vervolgens kan worden gebruikt om je eigen technologieën verder te ontwikkelen.
ufo-tech=De efficiëntie van een __ENTITY__fulgoran-ruin-attractor__ is legendarisch. Elektriciteitspalen uitgerust met een __ENTITY__ufo-adapter__ kunnen ermee verbinden.
ufo-fulgoran-know-how-tech=Maakt het gebruik van Fulgoran-knowhow mogelijk om je eigen technologieën te verbeteren
ufo-emp-tech=Maakt de bouw van de verbeterde __ENTITY__electromagnetic-plant__ mogelijk
ufo-recycling-tech=Maakt de bouw van __ENTITY__ufo-recycler__ mogelijk
ufo-effect-transmission-tech=Maakt de bouw van __ENTITY__ufo-beacon__ mogelijk
ufo-detector-equipment-tech=De Fulgoran Relikwiedetector (F.R.D.) helpt bij het zoeken naar bepaalde Fulgoran-relikwieën
ufo-pimp-my-car-tech=Breidt de __ENTITY__car__ uit met een klein uitrustingsrooster waarin een [item=ufo-detector-equipment] en een kleine stroomvoorziening kunnen worden geplaatst
ufo-resonance-raw-shard-tech=__ITEM__ufo-resonance-raw-shard__ vormt de basis van geavanceerdere technologieën die Fulgoran-knowhow gebruiken
ufo-resonance-shard-tech=belangrijkste onderdeel van de __ENTITY__ufo-inhibitor__
ufo-inhibitor-tech=beschermt een klein gebied

