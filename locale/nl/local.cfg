[mod-name]
ufo=Gebruik Fulgoran-objecten (U.F.O.)

[mod-description]
ufo=Heb je je ooit afgevraagd wat er met de Fulgorans is gebeurd of hoe hun technologie nuttig gebruikt kan worden?\nDan zou je archeologisch onderzoek moeten starten en dieper moeten graven; dan krijg je de antwoorden.\n\nMaar wees gewaarschuwd — je zou op iets kunnen stuiten dat je beter met rust had kunnen laten.

