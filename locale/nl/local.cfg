[entity-description]
ufo-adapter=Maakt het directe gebruik van Fulgoran-objecten mogelijk of het gebruik van Fulgoran-knowhow bij de bouw van verbeterde installaties.
ufo-adaptees=__1__ met __ENTITY__ufo-adapter__ kan verbinding maken met een __ENTITY__fulgoran-ruin-attractor__.
ufo-adapted-attractor=__ENTITY__fulgoran-ruin-attractor__ verbonden met een elektriciteitspaal met een __ENTITY__ufo-adapter__.
ufo-electromagnetic-plant=De met Fulgoran-knowhow verbeterde __ENTITY__electromagnetic-plant__ is compacter en efficiënter.
ufo-recycler=De verbeterde recycler is compacter.
ufo-beacon=De verbeterde __ENTITY__beacon__ is kleiner en krachtiger.
ufo-crusher=De __ENTITY__ufo-crusher__ kan alleen op planeten worden gebouwd.
ufo-inhibitor=__ENTITY__ufo-inhibitor__ biedt bescherming tijdens het handmatig ontginnen van een __ENTITY__fulgoran-ruin-vault__

[factoriopedia-description]
ufo-adapted-attractor=Volgens de legende heeft de __ENTITY__fulgoran-ruin-attractor__ een superieure efficiëntie. Dit kan worden benut met de __ENTITY__ufo-adapter__.
ufo-electromagnetic-plant=Door gebruik te maken van Fulgoran-knowhow heeft de verbeterde __ENTITY__electromagnetic-plant__ minder ruimte nodig en is deze efficiënter.
ufo-detector-equipment=De Fulgoran Relikwiedetector (F.R.D.) kan in verschillende voertuigen worden geïnstalleerd en helpt bij het zoeken naar specifieke Fulgoran-relikwieën.
ufo-recycler=Door gebruik te maken van Fulgoran-knowhow kan de verbeterde __ENTITY__recycler__ compacter worden gebouwd en verbruikt deze minder energie.
ufo-beacon=Door gebruik te maken van Fulgoran-knowhow heeft de verbeterde __ENTITY__beacon__ minder ruimte nodig, een groter bereik en meer moduleslots.
ufo-pimp-my-car=Geüpgradede __ENTITY__car__ met een klein uitrustingsrooster waarin [item=ufo-detector-equipment] en een kleine stroomvoorziening kunnen worden geplaatst
ufo-tech=Sleutel tot toegang tot Fulgoran-technologie
ufo-adapter=Centrale brug tussen Fulgoran- en eigen technologieën
ufo-crusher=De __ENTITY__ufo-crusher__ kan alleen op planeten worden gebouwd en is iets groter
ufo-resonance-raw-shard=__ITEM__ufo-resonance-raw-shard__
ufo-resonance-shard=__ITEM__ufo-resonance-shard__
ufo-inhibitor=__ENTITY__ufo-inhibitor__ biedt bescherming tegen de Bewaker bij het handmatig demonteren van een __ENTITY__fulgoran-ruin-vault__ door zijn sensoren te storen

