[mod-setting-description]
ufo-logLevel=alle aanroepen met dit logniveau of hoger worden gelogd (FATAL is het hoogste, FINEST het laagste niveau)
ufo-mined-ruin-vaults-needed=Aantal __ENTITY__fulgoran-ruin-vault__ dat moet worden ontgonnen om de technologie __ENTITY__ufo-adapter__ te onderzoeken.
ufo-frd-vaults-color=kleur waarmee een __ENTITY__fulgoran-ruin-vault__ wordt weergegeven in de __ITEM__ufo-detector-equipment__
ufo-frd-shard-color=kleur waarmee een __ENTITY__fe_resonance_shard__ wordt weergegeven in de __ITEM__ufo-detector-equipment__
ufo-frd-scan-radius=Straal waarbinnen de __ITEM__ufo-detector-equipment__ relikwieën kan detecteren
ufo-frd-bg-color=kies de achtergrondkleur van de F.R.D.
ufo-frd-free-bg-color=willekeurige achtergrondkleur voor de F.R.D. selecteer [font=default-semibold][color=red](werkt alleen als de geselecteerde achtergrondkleur "willekeurig" is)[/color][/font]

