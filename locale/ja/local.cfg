[entity-description]
ufo-adapter=フルゴランの物体を直接利用したり、改良設備の建設にフルゴランのノウハウを活用したりできるようにします。
ufo-adaptees=__ENTITY__ufo-adapter__ を備えた __1__ は __ENTITY__fulgoran-ruin-attractor__ に接続できます。
ufo-adapted-attractor=__ENTITY__ufo-adapter__ を備えた電柱に接続された __ENTITY__fulgoran-ruin-attractor__。
ufo-electromagnetic-plant=フルゴランのノウハウで改良された __ENTITY__electromagnetic-plant__ は、よりコンパクトで効率的です。
ufo-recycler=改良型リサイクラーはよりコンパクトです。
ufo-beacon=改良型 __ENTITY__beacon__ はより小型で強力です。
ufo-crusher=__ENTITY__ufo-crusher__ は惑星上でのみ建設できます。
ufo-inhibitor=__ENTITY__ufo-inhibitor__ は __ENTITY__fulgoran-ruin-vault__ を手動採掘する際に保護を提供します

[factoriopedia-description]
ufo-adapted-attractor=伝説によれば、__ENTITY__fulgoran-ruin-attractor__ は優れた効率を持っています。これは __ENTITY__ufo-adapter__ によって活用できます。
ufo-electromagnetic-plant=フルゴランのノウハウを活用することで、改良型 __ENTITY__electromagnetic-plant__ はより省スペースで高効率になります。
ufo-detector-equipment=フルゴラン遺物探知機（F.R.D.）はさまざまな車両に搭載でき、特定のフルゴラン遺物の探索を支援します。
ufo-recycler=フルゴランのノウハウを活用することで、改良型 __ENTITY__recycler__ はよりコンパクトに建設でき、消費電力も少なくなります。
ufo-beacon=フルゴランのノウハウを活用することで、改良型 __ENTITY__beacon__ はより省スペースになり、範囲が拡大し、モジュールスロットも増えます。
ufo-pimp-my-car=[item=ufo-detector-equipment] と小型電源を搭載できる小型装備グリッド付きの強化型 __ENTITY__car__
ufo-tech=フルゴラン技術へアクセスするための鍵
ufo-adapter=フルゴラン技術と自前の技術をつなぐ中心的な橋渡し
ufo-crusher=__ENTITY__ufo-crusher__ は惑星上でのみ建設でき、やや大型です
ufo-resonance-raw-shard=__ITEM__ufo-resonance-raw-shard__
ufo-resonance-shard=__ITEM__ufo-resonance-shard__
ufo-inhibitor=__ENTITY__ufo-inhibitor__ は __ENTITY__fulgoran-ruin-vault__ の手動採掘中にガーディアンのセンサーを妨害することでガーディアンからの保護を提供するが、常時電源供給が必要である

