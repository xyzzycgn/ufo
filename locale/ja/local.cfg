[technology-description]
ufo-archeological-tech=考古学的調査により、__ENTITY__fulgoran-ruin-vault__ を[font=default-semibold][color=green]手動で[/color][/font]採掘している間にフルゴラン技術に関する情報を得ることができ、それをさらに自前の技術の発展に活用できます。
ufo-tech=__ENTITY__fulgoran-ruin-attractor__ の効率は伝説的です。__ENTITY__ufo-adapter__ を装備した電柱はそれらに接続できます。
ufo-fulgoran-know-how-tech=フルゴランのノウハウを使って自前の技術を改良できるようにします
ufo-emp-tech=改良型 __ENTITY__electromagnetic-plant__ の建設を可能にします
ufo-recycling-tech=__ENTITY__ufo-recycler__ の建設を可能にします
ufo-effect-transmission-tech=__ENTITY__ufo-beacon__ の建設を可能にします
ufo-detector-equipment-tech=フルゴラン遺物探知機（F.R.D.）は特定のフルゴラン遺物の探索を支援します
ufo-pimp-my-car-tech=[item=ufo-detector-equipment] と小型電源を搭載できる小型装備グリッドを __ENTITY__car__ に追加します
ufo-resonance-raw-shard-tech=__ITEM__ufo-resonance-raw-shard__ はフルゴランのノウハウを活用するより高度な技術の基盤です
ufo-resonance-shard-tech=__ENTITY__ufo-inhibitor__ の最も重要な部品
ufo-inhibitor-tech=小さな範囲を保護します

