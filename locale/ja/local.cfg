[achievement-description]
ufo-rookie-archaeologist=最も有名な考古学者でさえ、最初は小さなところから始めた。研究は[technology=ufo-resonance-raw-shard-tech]から始まる。
ufo-senior-archaeologist=練習は完璧を生み、[technology=ufo-tech]の探査をマスターしよう。
ufo-ufo-experienced-archaeologist=有名な考古学者のように発掘し、危険を恐れず、[technology=ufo-fulgoran-know-how-tech]を研究しよう。

