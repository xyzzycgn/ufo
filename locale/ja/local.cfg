[mod-setting-description]
ufo-logLevel=このログレベル以上のすべての呼び出しが記録されます（FATAL が最高、FINEST が最低レベル）
ufo-mined-ruin-vaults-needed=__ENTITY__ufo-adapter__ 技術を研究するために採掘する必要がある __ENTITY__fulgoran-ruin-vault__ の数。
ufo-frd-vaults-color=__ENTITY__fulgoran-ruin-vault__ が __ITEM__ufo-detector-equipment__ 内で表示される色
ufo-frd-shard-color=__ENTITY__fe_resonance_shard__ が __ITEM__ufo-detector-equipment__ 内で表示される色
ufo-frd-scan-radius=__ITEM__ufo-detector-equipment__ が遺物を検知できる範囲の半径
ufo-frd-bg-color=F.R.D. の背景色を選択。
ufo-frd-free-bg-color=[font=default-semibold][color=red]選択した背景色が「カスタム」の場合にのみ有効です[/color][/font]

