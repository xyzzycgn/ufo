[mod-name]
ufo=フルゴランの物体を使う（U.F.O.）

[mod-description]
ufo=フルゴラン人に何が起こったのか、あるいは彼らの技術をどう役立てられるのか、不思議に思ったことはありませんか？\nそれなら、考古学的調査を始めてさらに深く掘り進めるべきです。そうすれば答えが得られるでしょう。\n\nただし注意してください――触れずにおいたほうがよかったものに出くわすかもしれません。

