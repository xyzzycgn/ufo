[technology-description]
ufo-archeological-tech=考古调查使你能够在[font=default-semibold][color=green]手动[/color][/font]开采 __ENTITY__fulgoran-ruin-vault__ 时获取有关富尔戈兰技术的信息，随后可用于进一步发展自身技术。
ufo-tech=__ENTITY__fulgoran-ruin-attractor__ 的效率堪称传奇。装备了 __ENTITY__ufo-adapter__ 的电线杆可以与其连接。
ufo-fulgoran-know-how-tech=允许使用富尔戈兰技术知识来改进自身技术
ufo-emp-tech=允许建造改良型 __ENTITY__electromagnetic-plant__
ufo-recycling-tech=允许建造 __ENTITY__ufo-recycler__
ufo-effect-transmission-tech=允许建造 __ENTITY__ufo-beacon__
ufo-detector-equipment-tech=富尔戈兰遗物探测器（F.R.D.）有助于寻找某些富尔戈兰遗物
ufo-pimp-my-car-tech=为 __ENTITY__car__ 扩展一个小型装备网格，可在其中安装 [item=ufo-detector-equipment] 和一个小型电源
ufo-resonance-raw-shard-tech=__ITEM__ufo-resonance-raw-shard__ 是利用富尔戈兰技术知识的更先进技术的基础
ufo-resonance-shard-tech=__ENTITY__ufo-inhibitor__ 最重要的部件
ufo-inhibitor-tech=保护一小片区域
ufo-electric-furnace-tech=可建造 __ENTITY__ufo-electric-furnace__
ufo-electrodynamic-fragmentation-tech=电动力碎解（EDF）是一种先进方法，通过在水下施加极短的高压放电来对复合材料进行选择性分离。因此，该工艺需要相对大量的水，但其中大部分可在封闭回路中重复利用，使其成为一种非常节省资源的工艺。

