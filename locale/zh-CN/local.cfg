[mod-name]
ufo=使用富尔戈兰物品（U.F.O.）

[mod-description]
ufo=你是否曾想过富尔戈兰人究竟发生了什么，或者他们的技术如何才能被有效利用？\n那么，你应该开始考古调查并挖得更深；你会得到答案。\n\n但要小心——你可能会碰到一些本该更好地被留在原地的东西。

[mod-setting-name]
ufo-logLevel=选择日志级别
ufo-mined-ruin-vaults-needed=__ENTITY__fulgoran-ruin-vault__ 数量
ufo-frd-vaults-color=__ENTITY__fulgoran-ruin-vault__ 的颜色
ufo-frd-shard-color=__ENTITY__fe_resonance_shard__ 的颜色
ufo-frd-scan-radius=F.R.D. 扫描半径
ufo-frd-bg-color=F.R.D. 的背景颜色
ufo-frd-free-bg-color=设置 F.R.D. 的自定义背景颜色

[mod-setting-description]
ufo-logLevel=所有具有此日志级别或更高级别的调用都会被记录（FATAL 为最高，FINEST 为最低）
ufo-mined-ruin-vaults-needed=研究 __ENTITY__ufo-adapter__ 技术所需开采的 __ENTITY__fulgoran-ruin-vault__ 数量。
ufo-frd-vaults-color=__ENTITY__fulgoran-ruin-vault__ 在 __ITEM__ufo-detector-equipment__ 中显示时使用的颜色
ufo-frd-shard-color=__ENTITY__fe_resonance_shard__ 在 __ITEM__ufo-detector-equipment__ 中显示时使用的颜色
ufo-frd-scan-radius=__ITEM__ufo-detector-equipment__ 可探测遗物的半径范围
ufo-frd-bg-color=选择 F.R.D. 背景颜色。
ufo-frd-free-bg-color=[font=default-semibold][color=red]仅当选定的背景颜色为“自定义”时才有效[/color][/font]

[string-mod-setting]
ufo-frd-bg-color-GREEN=绿色
ufo-frd-bg-color-AMBER=琥珀色
ufo-frd-bg-color-FREE=自定义

[string-mod-setting-description]
ufo-frd-bg-color-FREE=允许为 F.R.D. 选择任意背景颜色。

