[entity-description]
ufo-adapter=允许直接使用富尔戈兰物品，或在建造改良设施时使用富尔戈兰技术知识。
ufo-adaptees=带有 __ENTITY__ufo-adapter__ 的 __1__ 能够连接到 __ENTITY__fulgoran-ruin-attractor__。
ufo-adapted-attractor=连接到带有 __ENTITY__ufo-adapter__ 电线杆上的 __ENTITY__fulgoran-ruin-attractor__。
ufo-electromagnetic-plant=利用富尔戈兰技术知识改良后的 __ENTITY__electromagnetic-plant__ 更紧凑且更高效。
ufo-recycler=改良型回收机更加紧凑。
ufo-beacon=改良后的 __ENTITY__beacon__ 更小且更强大。
ufo-crusher=__ENTITY__ufo-crusher__ 只能建造在行星上。
ufo-inhibitor=__ENTITY__ufo-inhibitor__ 在手动开采 __ENTITY__fulgoran-ruin-vault__ 时提供保护
ufo-electric-furnace=改良型 __ENTITY__ufo-electric-furnace__ 占用更少空间，运行更快，也更清洁。
ufo-electrodynamic-fragmentation-device=使用电动力碎解（EDF）对复合材料进行选择性分离。

[factoriopedia-description]
ufo-adapted-attractor=传说中，__ENTITY__fulgoran-ruin-attractor__ 具有卓越的效率。通过 __ENTITY__ufo-adapter__ 可以加以利用。
ufo-electromagnetic-plant=利用富尔戈兰技术知识，改良后的 __ENTITY__electromagnetic-plant__ 占地更小且效率更高。
ufo-detector-equipment=富尔戈兰遗物探测器（F.R.D.）可安装在多种载具上，并协助搜索特定的富尔戈兰遗物。
ufo-recycler=利用富尔戈兰技术知识，改良后的 __ENTITY__recycler__ 可建造得更加紧凑，并消耗更少能量。
ufo-beacon=利用富尔戈兰技术知识，改良后的 __ENTITY__beacon__ 占地更小、范围更大，并拥有更多模块槽位。
ufo-pimp-my-car=升级后的 __ENTITY__car__ 带有一个小型装备网格，可安装 [item=ufo-detector-equipment] 和一个小型电源
ufo-tech=获取富尔戈兰技术的钥匙
ufo-adapter=连接富尔戈兰技术与自身技术的核心桥梁
ufo-crusher=__ENTITY__ufo-crusher__ 只能建造在行星上，并且体积稍大
ufo-resonance-raw-shard=__ITEM__ufo-resonance-raw-shard__
ufo-resonance-shard=__ITEM__ufo-resonance-shard__
ufo-inhibitor=__ENTITY__ufo-inhibitor__ 通过干扰传感器，在手动挖掘 __ENTITY__fulgoran-ruin-vault__ 时提供对守护者的保护，但需要持续的电源供应。
ufo-electric-furnace=改良型 __ENTITY__ufo-electric-furnace__ 在各方面都优于其前代。它占用更少空间，运行更快，污染更少，同时产能更高。
ufo-electrodynamic-fragmentation-device=电动力回收机使用电动力碎解（EDF）这一先进的选择性分离工艺，从复合材料中回收固体成分。
ufo-sand-from-concrete-rubble=使用电动力碎解（EDF）从混凝土碎块中回收沙子

