[entity-description]
ufo-adapter=Permet d'utiliser directement des objets fulgorans ou d'employer le savoir-faire fulgoran dans la construction d'installations améliorées
ufo-adaptees=__1__ avec __ENTITY__ufo-adapter__ est capable de se connecter à un __ENTITY__fulgoran-ruin-attractor__
ufo-adapted-attractor=__ENTITY__fulgoran-ruin-attractor__ connecté à un poteau électrique avec __ENTITY__ufo-adapter__
ufo-electromagnetic-plant=La __ENTITY__electromagnetic-plant__ améliorée grâce au savoir-faire fulgoran est plus compacte et plus efficace
ufo-recycler=Le recycleur amélioré est plus compact
ufo-beacon=Le __ENTITY__beacon__ amélioré est plus petit et plus puissant
ufo-crusher=Le __ENTITY__ufo-crusher__ ne peut être construit que sur des planètes
ufo-inhibitor= L'__ENTITY__ufo-inhibitor__ offre une protection lors de l'exploitation minière manuelle d'un __ENTITY__cave-ruine-fulgorienne__ en brouillant ses capteurs, mais nécessite une alimentation électrique constante.

[factoriopedia-description]
ufo-adapted-attractor=Selon la légende, le __ENTITY__fulgoran-ruin-attractor__ possède une efficacité supérieure. Celle-ci peut être exploitée avec le __ENTITY__ufo-adapter__.
ufo-electromagnetic-plant=Grâce à l'utilisation du savoir-faire fulgoran, la __ENTITY__electromagnetic-plant__ améliorée nécessite moins d'espace et est plus efficace.
ufo-detector-equipment=Le détecteur de reliques fulgoranes (F.R.D.) peut être installé dans différents véhicules et aide à rechercher certaines reliques fulgoranes
ufo-recycler=Grâce à l'utilisation du savoir-faire fulgoran, le __ENTITY__recycler__ amélioré peut être construit de manière plus compacte et consomme moins d'énergie.
ufo-beacon=Grâce à l'utilisation du savoir-faire fulgoran, le __ENTITY__beacon__ amélioré nécessite moins d'espace, a une portée accrue et davantage d'emplacements pour modules.
ufo-pimp-my-car=__ENTITY__car__ améliorée avec une petite grille d'équipement dans laquelle peuvent être montés un [item=ufo-detector-equipment] et une petite alimentation électrique
ufo-tech=Clé d'accès à la technologie fulgorane
ufo-adapter=Pont central entre les technologies fulgoranes et les technologies propres
ufo-crusher=Le __ENTITY__ufo-crusher__ ne peut être construit que sur des planètes et est légèrement plus grand
ufo-resonance-raw-shard=__ITEM__ufo-resonance-raw-shard__
ufo-resonance-shard=__ITEM__ufo-resonance-shard__
ufo-inhibitor=__ENTITY__ufo-inhibitor__ protège du Gardien lors de l'extraction manuelle d'un __ENTITY__fulgoran-ruin-vault__ en brouillant ses capteurs

