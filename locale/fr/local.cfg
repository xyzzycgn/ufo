[technology-description]
ufo-archeological-tech=Les recherches archéologiques permettent d'obtenir des informations sur la technologie fulgorane lors de l'extraction [font=default-semibold][color=green]manuelle[/color][/font] d'un __ENTITY__fulgoran-ruin-vault__, qui pourront ensuite être utilisées pour développer ses propres technologies
ufo-tech=L'efficacité d'un __ENTITY__fulgoran-ruin-attractor__ est légendaire. Avec un __ENTITY__ufo-adapter__, les poteaux électriques peuvent s'y connecter.
ufo-fulgoran-know-how-tech=permet l'utilisation du savoir-faire fulgoran pour améliorer ses propres technologies
ufo-emp-tech=Permet la construction de la __ENTITY__electromagnetic-plant__ améliorée
ufo-recycling-tech=Permet la construction du __ENTITY__ufo-recycler__
ufo-effect-transmission-tech=Permet la construction du __ENTITY__ufo-beacon__
ufo-detector-equipment-tech=Le détecteur de reliques fulgoranes (F.R.D.) aide à rechercher certaines reliques fulgoranes
ufo-pimp-my-car-tech=étend la __ENTITY__car__ avec une petite grille d'équipement dans laquelle peuvent être montés un [item=ufo-detector-equipment] et une petite alimentation électrique
ufo-resonance-raw-shard-tech=__ITEM__ufo-resonance-raw-shard__ constitue la base des technologies plus avancées qui utilisent le savoir-faire fulgoran
ufo-resonance-shard-tech=élément le plus important du __ENTITY__ufo-inhibitor__
ufo-inhibitor-tech=protège une petite zone

[achievement-name]
ufo-rookie-archaeologist=Archéologie pour débutants
ufo-senior-archaeologist=Archéologue confirmé
ufo-experienced-archaeologist=Archéologue expérimenté

[achievement-description]
ufo-rookie-archaeologist=Même les archéologues les plus célèbres ont commencé modestement. Recherchez [technology=ufo-resonance-raw-shard-tech]
ufo-senior-archaeologist=La pratique mène à la perfection et maîtrisez l'exploration de [technology=ufo-tech]
ufo-experienced-archaeologist=Creusez comme un archéologue renommé, ne craignez aucun danger et recherchez [technology=ufo-fulgoran-know-how-tech]

