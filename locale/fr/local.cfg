[mod-setting-description]
ufo-logLevel=Tous les appels avec ce niveau ou un niveau supérieur seront journalisés (FATAL est le plus élevé, FINEST le niveau le plus bas)
ufo-mined-ruin-vaults-needed=Nombre de __ENTITY__fulgoran-ruin-vault__ à extraire pour rechercher la technologie __ENTITY__ufo-adapter__
ufo-frd-vaults-color=couleur avec laquelle un __ENTITY__fulgoran-ruin-vault__ est affiché dans le __ITEM__ufo-detector-equipment__
ufo-frd-shard-color=couleur avec laquelle un __ENTITY__fe_resonance_shard__ est affiché dans le __ITEM__ufo-detector-equipment__
ufo-frd-scan-radius=Rayon dans lequel le __ITEM__ufo-detector-equipment__ peut détecter des reliques
ufo-frd-bg-color=choisir la couleur de fond du F.R.D.
ufo-frd-free-bg-color=[font=default-semibold][color=red]n'a d'effet que si la couleur de fond choisie est "personnalisée"[/color][/font]

