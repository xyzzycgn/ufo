[mod-name]
ufo=Utilisez des objets fulgorans (U.F.O.)

[mod-description]
ufo=Vous vous êtes toujours demandé ce qui est arrivé aux Fulgorans ou comment leur technologie pourrait être utilisée utilement ?\nEh bien, vous devriez alors lancer des recherches archéologiques et creuser plus profondément ; vous obtiendrez les réponses.\n\nMais attention - il se pourrait que vous tombiez sur quelque chose que vous auriez mieux fait de laisser tranquille.

