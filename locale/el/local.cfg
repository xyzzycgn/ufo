[mod-name]
ufo=Χρησιμοποιήστε αντικείμενα Fulgoran (U.F.O.)

[mod-description]
ufo=Αναρωτηθήκατε ποτέ τι συνέβη στους Fulgorans ή πώς θα μπορούσε η τεχνολογία τους να αξιοποιηθεί σωστά;\nΤότε θα πρέπει να ξεκινήσετε αρχαιολογικές έρευνες και να σκάψετε βαθύτερα· θα βρείτε τις απαντήσεις.\n\nΑλλά προσοχή — μπορεί να συναντήσετε κάτι που θα ήταν καλύτερα να είχε μείνει ανέγγιχτο.

[mod-setting-name]
ufo-logLevel=επιλογή επιπέδου καταγραφής
ufo-mined-ruin-vaults-needed=αριθμός __ENTITY__fulgoran-ruin-vault__
ufo-frd-vaults-color=χρώμα για __ENTITY__fulgoran-ruin-vault__
ufo-frd-shard-color=χρώμα για __ENTITY__fe_resonance_shard__
