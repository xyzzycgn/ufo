ufo-frd-bg-color=χρώμα φόντου για F.R.D.
ufo-frd-free-bg-color=ορίστε προσαρμοσμένο χρώμα φόντου για το F.R.D.

[mod-setting-description]
ufo-logLevel=όλες οι κλήσεις με αυτό το επίπεδο καταγραφής ή υψηλότερο θα καταγράφονται (το FATAL είναι το υψηλότερο, το FINEST το χαμηλότερο επίπεδο)
ufo-mined-ruin-vaults-needed=Αριθμός __ENTITY__fulgoran-ruin-vault__ που πρέπει να εξορυχθούν για να ερευνηθεί η τεχνολογία __ENTITY__ufo-adapter__.
ufo-frd-vaults-color=χρώμα με το οποίο εμφανίζεται ένα __ENTITY__fulgoran-ruin-vault__ στο __ITEM__ufo-detector-equipment__
ufo-frd-shard-color=χρώμα με το οποίο εμφανίζεται ένα __ENTITY__fe_resonance_shard__ στο __ITEM__ufo-detector-equipment__
ufo-frd-scan-radius=Ακτίνα εντός της οποίας το __ITEM__ufo-detector-equipment__ μπορεί να ανιχνεύει λείψανα
ufo-frd-bg-color=επιλέξτε χρώμα φόντου F.R.D.
ufo-frd-free-bg-color=[font=default-semibold][color=red]ισχύει μόνο αν το επιλεγμένο χρώμα φόντου είναι «έθιμο»[/color][/font]

