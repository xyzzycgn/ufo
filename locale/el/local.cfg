[entity-description]
ufo-adapter=Επιτρέπει την άμεση χρήση αντικειμένων Fulgoran ή τη χρήση τεχνογνωσίας Fulgoran στην κατασκευή βελτιωμένων εγκαταστάσεων.
ufo-adaptees=__1__ με __ENTITY__ufo-adapter__ μπορεί να συνδεθεί με ένα __ENTITY__fulgoran-ruin-attractor__.
ufo-adapted-attractor=__ENTITY__fulgoran-ruin-attractor__ συνδεδεμένο σε ηλεκτρικό στύλο με __ENTITY__ufo-adapter__.
ufo-electromagnetic-plant=Το __ENTITY__electromagnetic-plant__ που έχει βελτιωθεί με τεχνογνωσία Fulgoran είναι πιο συμπαγές και αποδοτικό.
ufo-recycler=Ο βελτιωμένος ανακυκλωτής είναι πιο συμπαγής.
ufo-beacon=Το βελτιωμένο __ENTITY__beacon__ είναι μικρότερο και ισχυρότερο.
ufo-crusher=Το __ENTITY__ufo-crusher__ μπορεί να κατασκευαστεί μόνο σε πλανήτες.
ufo-inhibitor=Το __ENTITY__ufo-inhibitor__ παρέχει προστασία κατά τη χειροκίνητη εξόρυξη ενός __ENTITY__fulgoran-ruin-vault__

[factoriopedia-description]
ufo-adapted-attractor=Σύμφωνα με τον θρύλο, το __ENTITY__fulgoran-ruin-attractor__ έχει ανώτερη απόδοση. Αυτό μπορεί να αξιοποιηθεί με το __ENTITY__ufo-adapter__.
ufo-electromagnetic-plant=Με την αξιοποίηση της τεχνογνωσίας Fulgoran, το βελτιωμένο __ENTITY__electromagnetic-plant__ απαιτεί λιγότερο χώρο και είναι πιο αποδοτικό.
ufo-detector-equipment=Ο Ανιχνευτής Λειψάνων Fulgoran (F.R.D.) μπορεί να εγκατασταθεί σε διάφορα οχήματα και βοηθά στην αναζήτηση συγκεκριμένων λειψάνων Fulgoran.
ufo-recycler=Με την αξιοποίηση της τεχνογνωσίας Fulgoran, το βελτιωμένο __ENTITY__recycler__ μπορεί να κατασκευαστεί πιο συμπαγές και καταναλώνει λιγότερη ενέργεια.
ufo-beacon=Με την αξιοποίηση της τεχνογνωσίας Fulgoran, το βελτιωμένο __ENTITY__beacon__ απαιτεί λιγότερο χώρο, έχει αυξημένη εμβέλεια και περισσότερες θέσεις μονάδων.
ufo-pimp-my-car=Αναβαθμισμένο __ENTITY__car__ με μικρό πλέγμα εξοπλισμού στο οποίο μπορούν να τοποθετηθούν [item=ufo-detector-equipment] και μια μικρή παροχή ενέργειας
ufo-tech=Κλειδί για την πρόσβαση στην τεχνολογία Fulgoran
ufo-adapter=Κεντρική γέφυρα μεταξύ της τεχνολογίας Fulgoran και των δικών σας τεχνολογιών
ufo-crusher=Το __ENTITY__ufo-crusher__ μπορεί να κατασκευαστεί μόνο σε πλανήτες και είναι ελαφρώς μεγαλύτερο
ufo-resonance-raw-shard=__ITEM__ufo-resonance-raw-shard__
ufo-resonance-shard=__ITEM__ufo-resonance-shard__
ufo-inhibitor=Το __ENTITY__ufo-inhibitor__ παρέχει προστασία από τον Φύλακα όταν αποσυναρμολογείτε χειροκίνητα ένα __ENTITY__fulgoran-ruin-vault__ παρεμβάλλοντας τους αισθητήρες του

