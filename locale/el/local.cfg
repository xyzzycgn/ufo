[technology-description]
ufo-archeological-tech=Οι αρχαιολογικές έρευνες επιτρέπουν την απόκτηση πληροφοριών για την τεχνολογία Fulgoran κατά τη [font=default-semibold][color=green]χειροκίνητη[/color][/font] εξόρυξη ενός __ENTITY__fulgoran-ruin-vault__, οι οποίες μπορούν στη συνέχεια να χρησιμοποιηθούν για την περαιτέρω ανάπτυξη των δικών σας τεχνολογιών.
ufo-tech=Η απόδοση ενός __ENTITY__fulgoran-ruin-attractor__ είναι θρυλική. Οι ηλεκτρικοί στύλοι εξοπλισμένοι με __ENTITY__ufo-adapter__ μπορούν να συνδεθούν με αυτά.
ufo-fulgoran-know-how-tech=Επιτρέπει τη χρήση της τεχνογνωσίας Fulgoran για τη βελτίωση των δικών σας τεχνολογιών
ufo-emp-tech=Επιτρέπει την κατασκευή του βελτιωμένου __ENTITY__electromagnetic-plant__
ufo-recycling-tech=Επιτρέπει την κατασκευή του __ENTITY__ufo-recycler__
ufo-effect-transmission-tech=Επιτρέπει την κατασκευή του __ENTITY__ufo-beacon__
ufo-detector-equipment-tech=Ο Ανιχνευτής Λειψάνων Fulgoran (F.R.D.) βοηθά στην αναζήτηση ορισμένων λειψάνων Fulgoran
ufo-pimp-my-car-tech=Επεκτείνει το __ENTITY__car__ με ένα μικρό πλέγμα εξοπλισμού στο οποίο μπορούν να τοποθετηθούν ένα [item=ufo-detector-equipment] και μια μικρή παροχή ενέργειας
ufo-resonance-raw-shard-tech=Το __ITEM__ufo-resonance-raw-shard__ αποτελεί τη βάση πιο προηγμένων τεχνολογιών που αξιοποιούν την τεχνογνωσία Fulgoran
ufo-resonance-shard-tech=το σημαντικότερο μέρος του __ENTITY__ufo-inhibitor__
ufo-inhibitor-tech=προστατεύει μια μικρή περιοχή

