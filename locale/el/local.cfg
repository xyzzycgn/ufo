ufo-senior-archaeologist=Η εξάσκηση τελειοποιεί και κατακτά την εξερεύνηση της [technology=ufo-tech]
ufo-experienced-archaeologist=Σκάψτε σαν διάσημος αρχαιολόγος, μην φοβάστε τους κινδύνους και ερευνήστε [technology=ufo-fulgoran-know-how-tech]

