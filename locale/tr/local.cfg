[mod-description]
ufo=Hiç Fulgoranlara ne olduğunu ya da teknolojilerinin nasıl faydalı şekilde kullanılabileceğini merak ettin mi?\nÖyleyse arkeolojik araştırmalara başlamalı ve daha derine kazmalısın; cevaplarını alacaksın.\n\nAma dikkat et - keşke olduğu gibi bıraksaydın diyeceğin bir şeyle karşılaşabilirsin.

