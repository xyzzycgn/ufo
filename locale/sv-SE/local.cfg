[entity-description]
ufo-adapter=Gör det möjligt att använda fulguranska objekt direkt eller att använda fulguranskt know-how vid konstruktion av förbättrade anläggningar
ufo-adaptees=__1__ med __ENTITY__ufo-adapter__ kan ansluta till en __ENTITY__fulgoran-ruin-attractor__
ufo-adapted-attractor=__ENTITY__fulgoran-ruin-attractor__ ansluten till en kraftstolpe med __ENTITY__ufo-adapter__
ufo-electromagnetic-plant=Den med fulguranskt know-how förbättrade __ENTITY__electromagnetic-plant__ är mer kompakt och effektiv
ufo-recycler=den förbättrade recyclern är mer kompakt byggd
ufo-beacon=den förbättrade __ENTITY__beacon__ är mindre och kraftfullare
ufo-crusher=__ENTITY__ufo-crusher__ kan endast byggas på planeter
ufo-inhibitor=__ENTITY__ufo-inhibitor__ ger skydd vid manuell brytning av en __ENTITY__fulgoran-ruin-vault__

[factoriopedia-description]
ufo-adapted-attractor=Enligt legenden har __ENTITY__fulgoran-ruin-attractor__ överlägsen effektivitet. Detta kan utnyttjas med __ENTITY__ufo-adapter__.
ufo-electromagnetic-plant=Genom att använda fulguranskt know-how kräver den förbättrade __ENTITY__electromagnetic-plant__ mindre utrymme och är mer effektiv.
ufo-detector-equipment=Fulguransk relikdetektor (F.R.D.) kan installeras i olika fordon och hjälper till vid sökandet efter vissa fulguranska reliker
ufo-recycler=Genom att använda fulguranskt know-how kan den förbättrade __ENTITY__recycler__ byggas mer kompakt och förbrukar mindre energi.
ufo-beacon=Genom att använda fulguranskt know-how kräver den förbättrade __ENTITY__beacon__ mindre utrymme, har ökad räckvidd och fler modulplatser.
ufo-pimp-my-car=Uppgraderad __ENTITY__car__ med ett litet utrustningsrutnät där [item=ufo-detector-equipment] och en liten strömförsörjning kan monteras
ufo-tech=Nyckel till åtkomst till fulguransk teknologi
ufo-adapter=Central brygga mellan fulguranska och egna teknologier
ufo-crusher=__ENTITY__ufo-crusher__ kan endast byggas på planeter och är något större
ufo-resonance-raw-shard=__ITEM__ufo-resonance-raw-shard__
ufo-resonance-shard=__ITEM__ufo-resonance-shard__
ufo-inhibitor=__ENTITY__ufo-inhibitor__ ger skydd mot Väktaren vid manuell brytning av en __ENTITY__fulgoran-ruin-vault__ genom att störa dess sensorer

