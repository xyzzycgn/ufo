[technology-description]
ufo-archeological-tech=Arkeologiska undersökningar gör det möjligt att få information om fulguransk teknologi vid [font=default-semibold][color=green]manuell[/color][/font] brytning av en __ENTITY__fulgoran-ruin-vault__, som sedan kan användas för att vidareutveckla den egna teknologin
ufo-tech=Effektiviteten hos en __ENTITY__fulgoran-ruin-attractor__ är legendarisk. Kraftstolpar utrustade med en __ENTITY__ufo-adapter__ kan ansluta till dem.
ufo-fulgoran-know-how-tech=gör det möjligt att använda fulguranskt know-how för att förbättra egna teknologier
ufo-emp-tech=Gör det möjligt att bygga den förbättrade __ENTITY__electromagnetic-plant__
ufo-recycling-tech=Gör det möjligt att bygga __ENTITY__ufo-recycler__
ufo-effect-transmission-tech=Gör det möjligt att bygga __ENTITY__ufo-beacon__
ufo-detector-equipment-tech=Fulguransk relikdetektor (F.R.D.) hjälper till vid sökandet efter vissa fulguranska reliker
ufo-pimp-my-car-tech=utökar __ENTITY__car__ med ett litet utrustningsrutnät där [item=ufo-detector-equipment] och en liten strömförsörjning kan monteras
ufo-resonance-raw-shard-tech=__ITEM__ufo-resonance-raw-shard__ är grunden för mer avancerade teknologier som använder fulguranskt know-how
ufo-resonance-shard-tech=viktigaste delen av __ENTITY__ufo-inhibitor__
ufo-inhibitor-tech=skyddar ett litet område

