[mod-name]
ufo=Använd fulguranska objekt (U.F.O.)

[mod-description]
ufo=Har du någonsin undrat vad som hände med Fulgoranerna eller hur deras teknik skulle kunna användas på ett meningsfullt sätt?\nDå bör du starta arkeologiska undersökningar och gräva djupare, så får du svaren.\n\nMen se upp - du kan stöta på något som du hade gjort bättre i att lämna ifred.

