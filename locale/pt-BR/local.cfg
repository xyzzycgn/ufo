[technology-description]
ufo-archeological-tech=As investigações arqueológicas permitem obter informações sobre a tecnologia fulgoriana durante a mineração [font=default-semibold][color=green]manual[/color][/font] de um __ENTITY__fulgoran-ruin-vault__, que depois podem ser usadas para desenvolver ainda mais as próprias tecnologias.
ufo-tech=A eficiência de um __ENTITY__fulgoran-ruin-attractor__ é lendária. Postes elétricos equipados com um __ENTITY__ufo-adapter__ podem se conectar a eles.
ufo-fulgoran-know-how-tech=Permite o uso do conhecimento fulgoriano para aprimorar as próprias tecnologias
ufo-emp-tech=Permite a construção da __ENTITY__electromagnetic-plant__ aprimorada
ufo-recycling-tech=Permite a construção de __ENTITY__ufo-recycler__
ufo-effect-transmission-tech=Permite a construção de __ENTITY__ufo-beacon__
ufo-detector-equipment-tech=O Detector de Relíquias Fulgorianas (F.R.D.) auxilia na busca por certas relíquias fulgorianas
ufo-pimp-my-car-tech=Expande o __ENTITY__car__ com uma pequena grade de equipamentos na qual podem ser montados um [item=ufo-detector-equipment] e uma pequena fonte de energia
ufo-resonance-raw-shard-tech=__ITEM__ufo-resonance-raw-shard__ é a base de tecnologias mais avançadas que utilizam conhecimento fulgoriano
ufo-resonance-shard-tech=parte mais importante do __ENTITY__ufo-inhibitor__
ufo-inhibitor-tech=protege uma pequena área

