[mod-setting-description]
ufo-logLevel=todas as chamadas com este nível de log ou superior serão registradas (FATAL é o mais alto, FINEST o mais baixo)
ufo-mined-ruin-vaults-needed=Número de __ENTITY__fulgoran-ruin-vault__ que precisam ser minerados para pesquisar a tecnologia __ENTITY__ufo-adapter__.
ufo-frd-vaults-color=cor com a qual um __ENTITY__fulgoran-ruin-vault__ é exibido no __ITEM__ufo-detector-equipment__
ufo-frd-shard-color=cor com a qual um __ENTITY__fe_resonance_shard__ é exibido no __ITEM__ufo-detector-equipment__
ufo-frd-scan-radius=Raio dentro do qual o __ITEM__ufo-detector-equipment__ pode detectar relíquias
ufo-frd-bg-color=escolher a cor de fundo do F.R.D.
ufo-frd-free-bg-color=qualquer cor de fundo do F.R.D. selecionar [font=default-semibold][color=red](só tem efeito se a cor de fundo selecionada for "qualquer")[/color][/font]

[string-mod-setting]
ufo-frd-bg-color-GREEN=verde
ufo-frd-bg-color-AMBER=âmbar
ufo-frd-bg-color-FREE=qualquer

[string-mod-setting-description]
ufo-frd-bg-color-FREE=permitir a escolha de uma cor de fundo arbitrária para o F.R.D.

