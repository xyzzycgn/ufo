[mod-name]
ufo=Use objetos fulgorianos (U.F.O.)

[mod-description]
ufo=Você já se perguntou o que aconteceu com os Fulgorianos ou como a tecnologia deles poderia ser bem aproveitada?\nBem, então você deve iniciar investigações arqueológicas e cavar mais fundo; assim obterá as respostas.\n\nMas cuidado — você pode acabar encontrando algo que teria sido melhor deixar em paz.

