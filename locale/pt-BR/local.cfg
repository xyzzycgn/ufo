[entity-description]
ufo-adapter=Permite o uso direto de objetos fulgorianos ou o uso do conhecimento fulgoriano na construção de instalações aprimoradas.
ufo-adaptees=__1__ com __ENTITY__ufo-adapter__ é capaz de se conectar a um __ENTITY__fulgoran-ruin-attractor__.
ufo-adapted-attractor=__ENTITY__fulgoran-ruin-attractor__ conectado a um poste elétrico com um __ENTITY__ufo-adapter__.
ufo-electromagnetic-plant=A __ENTITY__electromagnetic-plant__ aprimorada com conhecimento fulgoriano é mais compacta e eficiente.
ufo-recycler=O reciclador aprimorado é mais compacto.
ufo-beacon=O __ENTITY__beacon__ aprimorado é menor e mais poderoso.
ufo-crusher=O __ENTITY__ufo-crusher__ só pode ser construído em planetas.
ufo-inhibitor=__ENTITY__ufo-inhibitor__ oferece proteção durante a mineração manual de um __ENTITY__fulgoran-ruin-vault__
ufo-electric-furnace=A __ENTITY__ufo-electric-furnace__ aprimorada ocupa menos espaço, é mais rápida e mais limpa.
ufo-electrodynamic-fragmentation-device=Usa fragmentação eletrodinâmica (EDF) para a separação seletiva de materiais compostos.

[factoriopedia-description]
ufo-adapted-attractor=Segundo a lenda, o __ENTITY__fulgoran-ruin-attractor__ possui eficiência superior. Isso pode ser aproveitado com o __ENTITY__ufo-adapter__.
ufo-electromagnetic-plant=Ao utilizar conhecimento fulgoriano, a __ENTITY__electromagnetic-plant__ aprimorada requer menos espaço e é mais eficiente.
ufo-detector-equipment=O Detector de Relíquias Fulgorianas (F.R.D.) pode ser instalado em vários veículos e auxilia na busca por relíquias fulgorianas específicas.
ufo-recycler=Ao utilizar conhecimento fulgoriano, o __ENTITY__recycler__ aprimorado pode ser construído de forma mais compacta e consome menos energia.
ufo-beacon=Ao utilizar conhecimento fulgoriano, o __ENTITY__beacon__ aprimorado requer menos espaço, tem maior alcance e mais slots de módulos.
ufo-pimp-my-car=__ENTITY__car__ aprimorado com uma pequena grade de equipamentos que pode montar [item=ufo-detector-equipment] e uma pequena fonte de energia
ufo-tech=Chave para acessar a tecnologia fulgoriana
ufo-adapter=Ponte central entre a tecnologia fulgoriana e as tecnologias próprias
ufo-crusher=O __ENTITY__ufo-crusher__ só pode ser construído em planetas e é ligeiramente maior
ufo-resonance-raw-shard=__ITEM__ufo-resonance-raw-shard__
ufo-resonance-shard=__ITEM__ufo-resonance-shard__
ufo-inhibitor=O __ENTITY__ufo-inhibitor__ oferece proteção contra o Guardião durante a mineração manual de um __ENTITY__fulgoran-ruin-vault__ bloqueando seus sensores, mas requer uma fonte de alimentação constante.
ufo-electric-furnace=A __ENTITY__ufo-electric-furnace__ aprimorada é superior à sua antecessora em todos os aspectos. Ela ocupa menos espaço, funciona mais rápido e produz menos poluição, além de ser mais produtiva.
ufo-electrodynamic-fragmentation-device=Um reciclador eletrodinâmico usa fragmentação eletrodinâmica (EDF), um processo avançado de separação seletiva, para recuperar componentes sólidos de materiais compostos.
ufo-sand-from-concrete-rubble=Recuperação de areia a partir de entulho de concreto usando fragmentação eletrodinâmica (EDF)

